// ─── REPORTS ───
function Reports({ data, fyFilter, setFyFilter }) {
  const [stmtClient, setStmtClient] = useState(null);
  const allInvoices = data.invoices || [];
  const allExpenses = data.expenses || [];
  const allReceipts = data.receipts || [];
  const invoices = fyFilter==='All' ? allInvoices : allInvoices.filter(i=>getFY(i.date)===fyFilter);
  const expenses = fyFilter==='All' ? allExpenses : allExpenses.filter(e=>getFY(e.date)===fyFilter);
  const receipts = fyFilter==='All' ? allReceipts : allReceipts.filter(r=>getFY(r.date)===fyFilter);

  const totalBilled = revenueOf(invoices);
  const totalGSTCollected = gstCollectedOf(invoices);
  const totalReceived = receipts.reduce((a,b)=>a+(parseFloat(b.amount)||0),0);
  const totalExpenses = expenses.reduce((a,b)=>a+(parseFloat(b.amount)||0),0);
  const totalGSTInput = expenses.reduce((a,b)=>a+(parseFloat(b.gstInput)||0),0);
  const netGST = totalGSTCollected - totalGSTInput;
  const netPL = totalReceived - totalExpenses;

  const byClient = {};
  invoices.forEach(inv => {
    if (!inv.clientName) return;
    if (!isRevenueDoc(inv)) return;  // skip proforma, quotation, superseded, cancelled
    if (!byClient[inv.clientName]) byClient[inv.clientName] = 0;
    byClient[inv.clientName] += inv.grand||0;
  });
  const topClients = Object.entries(byClient).sort((a,b)=>b[1]-a[1]).slice(0,8);

  const byCat = {};
  expenses.forEach(e => {
    const c = e.category||'Other';
    if (!byCat[c]) byCat[c] = 0;
    byCat[c] += parseFloat(e.amount)||0;
  });

  const exportFullReport = () => {
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(invoices.map(i=>({...i,lines:undefined}))), 'Invoices');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(receipts), 'Receipts');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(expenses), 'Expenses');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(data.clients||[]), 'Clients');
    XLSX.writeFile(wb, `GoSystematic_FullReport_${today()}.xlsx`);
  };

  return (
    <div>
      <div className="flex-between" style={{marginBottom:20}}>
        <div>
          <div className="section-title">Reports & Analytics</div>
          <div className="section-sub">Financial overview for <strong>{fyFilter==='All'?'All Years':fyFilter}</strong></div>
        </div>
        <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
          <button className="btn btn-amber" onClick={exportFullReport}>⬇ Export Full Report (Excel)</button>
          <button className="btn btn-outline" onClick={()=>setStmtClient('pick')}>📋 Client Statement PDF</button>
        </div>
      </div>

      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16,flexWrap:'wrap',gap:10}}>
        <div>
          <div className="section-title">Dashboard</div>
          <div className="section-sub">Financial overview for <strong>{fyFilter==='All'?'All Years':fyFilter}</strong></div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <span style={{fontSize:12,color:'var(--text-muted)',fontWeight:500}}>Financial Year:</span>
          <div className="tabs" style={{marginBottom:0}}>
            {ALL_FYS.map(fy=>(
              <button key={fy} className={`tab-btn ${fyFilter===fy?'active':''}`} onClick={()=>setFyFilter(fy)}>{fy}</button>
            ))}
          </div>
        </div>
      </div>
      <div className="stats-grid">
        <div className="stat-card navy"><div className="stat-label">Total Revenue</div><div className="stat-value">{fmt(totalBilled)}</div></div>
        <div className="stat-card blue"><div className="stat-label">Received</div><div className="stat-value">{fmt(totalReceived)}</div></div>
        <div className="stat-card amber"><div className="stat-label">Net GST Payable</div><div className="stat-value">{fmt(netGST)}</div><div className="stat-sub">Collected: {fmt(totalGSTCollected)} | Input: {fmt(totalGSTInput)}</div></div>
        <div className="stat-card brown"><div className="stat-label">Net P&L</div><div className="stat-value">{fmt(netPL)}</div><div className="stat-sub">Revenue - Expenses</div></div>
      </div>

      <div className="grid-2">
        <div className="card">
          <div className="card-header"><span className="card-title">Top Clients by Revenue</span></div>
          <div className="card-body">
            {topClients.length===0 ? <p className="text-muted" style={{fontSize:13}}>No invoice data yet.</p>
            : topClients.map(([name,amt])=>(
              <div key={name} style={{marginBottom:12}}>
                <div className="flex-between" style={{marginBottom:4}}>
                  <span style={{fontSize:13}}>{name}</span>
                  <span className="amount">{fmt(amt)}</span>
                </div>
                <div style={{height:5,background:'var(--border)',borderRadius:3}}>
                  <div style={{height:5,width:`${(amt/topClients[0][1])*100}%`,background:'var(--blue)',borderRadius:3}}/>
                </div>
              </div>
            ))}
          </div>
        </div>
        <div className="card">
          <div className="card-header"><span className="card-title">Expenses by Category</span></div>
          <div className="card-body">
            {Object.keys(byCat).length===0 ? <p className="text-muted" style={{fontSize:13}}>No expense data yet.</p>
            : Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([cat,amt])=>(
              <div key={cat} style={{marginBottom:12}}>
                <div className="flex-between" style={{marginBottom:4}}>
                  <span style={{fontSize:13}}>{cat}</span>
                  <span className="amount" style={{color:'var(--danger)'}}>{fmt(amt)}</span>
                </div>
                <div style={{height:5,background:'var(--border)',borderRadius:3}}>
                  <div style={{height:5,width:`${(amt/Math.max(...Object.values(byCat)))*100}%`,background:'var(--amber)',borderRadius:3}}/>
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>

      <div className="card" style={{marginTop:20}}>
        <div className="card-header"><span className="card-title">GST Summary (for Filing)</span></div>
        <div className="card-body">
          <div className="alert alert-warning">⚠️ GST registration pending. These figures are for internal tracking only.</div>
          <table>
            <thead><tr><th>Description</th><th>Amount</th></tr></thead>
            <tbody>
              <tr><td>Total GST Collected (Output Tax)</td><td className="amount">{fmt(totalGSTCollected)}</td></tr>
              <tr><td>Total GST on Purchases (Input Tax Credit)</td><td className="amount">{fmt(totalGSTInput)}</td></tr>
              <tr><td><strong>Net GST Payable</strong></td><td className="amount" style={{color:'var(--navy)',fontWeight:700}}>{fmt(netGST)}</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

function GitHubConfigForm({ github, onSave }) {
  const [cfg, setCfg] = useState(github.config);
  const [testing, setTesting] = useState(false);
  const [testResult, setTestResult] = useState(null);
  const set = (k,v) => setCfg(c=>({...c,[k]:v}));

  const test = async () => {
    setTesting(true); setTestResult(null);
    try {
      const r = await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}`, {
        headers: { Authorization: `token ${cfg.token}`, Accept: 'application/vnd.github.v3+json' }
      });
      setTestResult(r.ok ? 'success' : 'error');
    } catch { setTestResult('error'); }
    setTesting(false);
  };

  return (
    <div>
      <div className="alert alert-info">ℹ️ Your data will be stored as <code>accounts-data.json</code> in your GitHub repo.</div>
      <div className="form-group"><label className="form-label">GitHub Owner (username/org)</label><input className="form-control" value={cfg.owner} onChange={e=>set('owner',e.target.value)} placeholder="your-github-username"/></div>
      <div className="form-group"><label className="form-label">Repository Name</label><input className="form-control" value={cfg.repo} onChange={e=>set('repo',e.target.value)} placeholder="go-systematic-accounts"/></div>
      <div className="form-group"><label className="form-label">Branch</label><input className="form-control" value={cfg.branch} onChange={e=>set('branch',e.target.value)} placeholder="main"/></div>
      <div className="form-group"><label className="form-label">Personal Access Token</label><input type="password" className="form-control" value={cfg.token} onChange={e=>set('token',e.target.value)} placeholder="ghp_…"/><div style={{fontSize:11,color:'var(--text-muted)',marginTop:4}}>Needs repo read/write permission. Never share this token.</div></div>
      {testResult && <div className={`alert ${testResult==='success'?'alert-success':'alert-warning'}`}>{testResult==='success'?'✅ Connected successfully!':'❌ Connection failed. Check your credentials.'}</div>}
      <div className="flex-gap">
        <button className="btn btn-outline" onClick={test} disabled={testing}>{testing?'Testing…':'🔌 Test Connection'}</button>
        <button className="btn btn-primary" onClick={()=>github.saveConfig(cfg)}>💾 Save Config</button>
      </div>
    </div>
  );
}

// ─── PWA INSTALL PROMPT ──────────────────────────────────────
function PWAInstallPrompt() {
  const [deferredPrompt, setDeferredPrompt] = useState(null);
  const [showBanner, setShowBanner] = useState(false);

  useEffect(()=>{
    const handler = (e) => { e.preventDefault(); setDeferredPrompt(e); setShowBanner(true); };
    window.addEventListener('beforeinstallprompt', handler);
    return ()=>window.removeEventListener('beforeinstallprompt', handler);
  },[]);

  const install = async () => {
    if(!deferredPrompt) return;
    deferredPrompt.prompt();
    const {outcome} = await deferredPrompt.userChoice;
    if(outcome==='accepted') setShowBanner(false);
    setDeferredPrompt(null);
  };

  if(!showBanner) return null;
  return (
    <div style={{position:'fixed',bottom:70,left:0,right:0,zIndex:500,display:'flex',justifyContent:'center',padding:'0 16px',pointerEvents:'none'}}>
      <div style={{background:'var(--navy)',color:'white',borderRadius:12,padding:'12px 18px',display:'flex',alignItems:'center',gap:12,boxShadow:'0 8px 32px rgba(0,0,0,0.3)',maxWidth:400,width:'100%',pointerEvents:'all'}}>
        <span style={{fontSize:28}}>📲</span>
        <div style={{flex:1}}>
          <div style={{fontWeight:700,fontSize:13}}>Add to Home Screen</div>
          <div style={{fontSize:11,color:'rgba(255,255,255,0.6)',marginTop:2}}>Install GS Accounts for quick access</div>
        </div>
        <button className="btn btn-amber btn-sm" onClick={install}>Install</button>
        <button className="btn btn-ghost btn-sm" onClick={()=>setShowBanner(false)} style={{color:'rgba(255,255,255,0.5)',padding:'4px 6px'}}>✕</button>
      </div>
    </div>
  );
}


// ─── CLIENT STATEMENT MODAL ──────────────────────────────────
function ClientStatementModal({ data, clients, onClose, fyFilter }) {
  const [selectedClient, setSelectedClient] = useState('');
  const allClients = [...new Set([
    ...clients.map(c=>c.name),
    ...(data.invoices||[]).map(i=>i.clientName),
    ...(data.receipts||[]).map(r=>r.clientName),
  ].filter(Boolean))].sort();

  const clientInvoices = (data.invoices||[]).filter(i=>i.clientName===selectedClient && (fyFilter==='All'||!fyFilter||getFY(i.date)===fyFilter));
  const clientReceipts = (data.receipts||[]).filter(r=>r.clientName===selectedClient && (fyFilter==='All'||!fyFilter||getFY(r.date)===fyFilter));
  const totalBilled = clientInvoices.reduce((a,b)=>a+(b.grand||0),0);
  const totalReceived = clientReceipts.reduce((a,b)=>a+(parseFloat(b.amount)||0),0);
  const outstanding = totalBilled - totalReceived;

  const generatePDF = () => {
    if(!selectedClient){ alert('Please select a client'); return; }
    exportClientStatementPDF(selectedClient, clientInvoices, clientReceipts, fyFilter);
  };

  return (
    <div className="modal-backdrop">
      <div className="modal" style={{maxWidth:700}}>
        <div className="modal-header">
          <h2>📋 Client Statement</h2>
          <button className="modal-close" onClick={onClose}>✕</button>
        </div>
        <div className="modal-body">
          <div className="form-grid-2" style={{marginBottom:16}}>
            <div className="form-group">
              <label className="form-label">Select Client</label>
              <select className="form-control" value={selectedClient} onChange={e=>setSelectedClient(e.target.value)}>
                <option value="">— Choose client —</option>
                {allClients.map(c=><option key={c} value={c}>{c}</option>)}
              </select>
            </div>
            <div className="form-group">
              <label className="form-label">Financial Year</label>
              <div style={{padding:'9px 12px',border:'1.5px solid var(--border)',borderRadius:6,fontSize:13,color:'var(--text-muted)'}}>{fyFilter||'All'}</div>
            </div>
          </div>
          {selectedClient && (
            <>
              <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12,marginBottom:16}}>
                {[['Total Billed',fmt(totalBilled),'var(--navy)'],['Received',fmt(totalReceived),'var(--success)'],['Outstanding',fmt(outstanding),outstanding>0?'var(--danger)':'var(--success)']].map(([l,v,c])=>(
                  <div key={l} style={{background:'var(--off-white)',borderRadius:8,padding:12,border:'1px solid var(--border)'}}>
                    <div style={{fontSize:10,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:0.5}}>{l}</div>
                    <div style={{fontFamily:'Rajdhani,sans-serif',fontSize:20,fontWeight:700,color:c,marginTop:2}}>{v}</div>
                  </div>
                ))}
              </div>
              <div className="table-wrap">
                <table>
                  <thead><tr><th>Date</th><th>Document</th><th>Type</th><th>Amount</th><th>Status</th></tr></thead>
                  <tbody>
                    {[...clientInvoices.map(i=>({date:i.date,num:i.number,type:i.type,amt:fmt(i.grand),status:i.status,color:'var(--navy)'})),
                      ...clientReceipts.map(r=>({date:r.date,num:r.number,type:'Payment Receipt',amt:fmt(r.amount),status:'Received',color:'var(--success)'}))
                    ].sort((a,b)=>new Date(a.date)-new Date(b.date)).map((row,i)=>(
                      <tr key={i}>
                        <td>{fmtDate(row.date)}</td>
                        <td className="font-mono" style={{fontSize:12}}>{row.num}</td>
                        <td><span className="badge badge-navy" style={{fontSize:10}}>{row.type}</span></td>
                        <td className="amount" style={{color:row.color}}>{row.amt}</td>
                        <td><StatusBadge s={row.status}/></td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </>
          )}
        </div>
        <div className="modal-footer">
          <button className="btn btn-outline" onClick={onClose}>Close</button>
          {selectedClient && <button className="btn btn-primary" onClick={generatePDF}>📄 Download Statement PDF</button>}
        </div>
      </div>
    </div>
  );
}


// ─── EXPORT FUNCTIONS ───
function exportICRPDF(doc, form, company) {
  var C = (company && company.brand) ? company : DEFAULT_COMPANY;
  var jsPDF = window.jspdf.jsPDF;
  var pdf = new jsPDF({ orientation:'portrait', unit:'mm', format:'a4' });

  // ── Page geometry ──────────────────────────────────────────
  var W=210, PL=14, PR=196;
  var INNER = PR - PL;          // 182mm usable width
  var TV    = PR - 2;           // text right-anchor (2mm breathing room)
  var FOOTER_Y = 277;           // footer starts here
  var MAX_Y    = FOOTER_Y - 6;  // last safe y before footer

  // ── Sanitise text: strip chars jsPDF can't render ─────────
  function clean(s){ return (s||'').replace(/₹/g,'Rs.').replace(/[^\x20-\x7E\n]/g,' ').trim(); }

  var RS='Rs.';
  var fmtAmt = function(n){ return RS+' '+Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}); };
  var fmtNum = function(n){ return Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}); };

  // ── Palette ────────────────────────────────────────────────
  var NAVY=[13,26,58],  AMBER=[188,113,31], WHITE=[255,255,255];
  var LBLUE=[232,239,252], LGRAY=[245,248,253];
  var GRAY=[100,115,135],  DARK=[20,32,65],  SLATE=[175,188,215];
  var GREEN=[20,130,70],   GREENBG=[230,248,238];

  var subtotal=doc.subtotal||0, gstTotal=doc.gstTotal||0;
  var discAmt=doc.discAmt||0,   grand=doc.grand||0;
  var isGstR=gstReal(C);

  // ── Page overflow helper ────────────────────────────────────
  // Call before drawing any block. If block won't fit, add new page and reset y.
  function ensureSpace(y, neededH) {
    if (y + neededH > MAX_Y) {
      pdf.addPage();
      // Repeat thin header stripe on continuation pages
      pdf.setFillColor(NAVY[0],NAVY[1],NAVY[2]); pdf.rect(0,0,W,10,'F');
      pdf.setFillColor(AMBER[0],AMBER[1],AMBER[2]); pdf.rect(0,10,W/2,1.5,'F');
      pdf.setFillColor(GREEN[0],GREEN[1],GREEN[2]); pdf.rect(W/2,10,W/2,1.5,'F');
      pdf.setTextColor(WHITE[0],WHITE[1],WHITE[2]);
      pdf.setFont('helvetica','bold'); pdf.setFontSize(8);
      pdf.text((C.brand||'Go Systematic')+' — Invoice cum Receipt (continued)', PL, 7);
      pdf.setFont('helvetica','normal'); pdf.setFontSize(7); pdf.setTextColor(SLATE[0],SLATE[1],SLATE[2]);
      pdf.text(clean(doc.number||''), PR, 7, {align:'right'});
      return 18; // new y after mini-header
    }
    return y;
  }

  // ── HEADER ─────────────────────────────────────────────────
  pdf.setFillColor(NAVY[0],NAVY[1],NAVY[2]); pdf.rect(0,0,W,46,'F');
  pdf.setFillColor(AMBER[0],AMBER[1],AMBER[2]); pdf.rect(0,46,W/2,2.5,'F');
  pdf.setFillColor(GREEN[0],GREEN[1],GREEN[2]);  pdf.rect(W/2,46,W/2,2.5,'F');

  try { pdf.addImage('data:image/png;base64,'+ICON_B64,'PNG',PL,7,32,32); } catch(e){}

  var CX=PL+36;
  pdf.setTextColor(WHITE[0],WHITE[1],WHITE[2]);
  pdf.setFont('helvetica','bold'); pdf.setFontSize(18);
  pdf.text(clean(C.brand||'Go Systematic'), CX, 16);
  pdf.setFont('helvetica','normal'); pdf.setFontSize(6.5);
  pdf.setTextColor(AMBER[0],AMBER[1],AMBER[2]);
  pdf.text(clean(C.tagline||'AUTOMATE. ACCELERATE. ACHIEVE. AI'), CX, 22);
  pdf.setTextColor(SLATE[0],SLATE[1],SLATE[2]); pdf.setFontSize(7.5);
  pdf.text(clean(C.name||'Automation Pursuits LLP'), CX, 28);
  if(C.address){
    var aLines=pdf.splitTextToSize(clean(C.address), 90);
    aLines.slice(0,2).forEach(function(l,i){ pdf.text(l,CX,33+i*5); });
  }
  var cParts=[C.email,C.phone].filter(Boolean);
  if(cParts.length) pdf.text(clean(cParts.join('  |  ')), CX, 44);

  // Title: INVOICE cum RECEIPT — measured, single baseline, right-aligned
  pdf.setFont('helvetica','bold');
  var FS1=13, FS2=9;
  pdf.setFontSize(FS1); var wI=pdf.getTextWidth('INVOICE ');
  pdf.setFontSize(FS2); var wC=pdf.getTextWidth('cum ');
  pdf.setFontSize(FS1); var wR=pdf.getTextWidth('RECEIPT');
  var titleX=PR-(wI+wC+wR), titleY=17;
  pdf.setFontSize(FS1); pdf.setTextColor(AMBER[0],AMBER[1],AMBER[2]); pdf.text('INVOICE ', titleX, titleY);
  pdf.setFontSize(FS2); pdf.setTextColor(180,200,235); pdf.text('cum ', titleX+wI, titleY);
  pdf.setFontSize(FS1); pdf.setTextColor(GREEN[0],GREEN[1],GREEN[2]); pdf.text('RECEIPT', titleX+wI+wC, titleY);

  pdf.setFont('helvetica','normal'); pdf.setFontSize(8); pdf.setTextColor(195,210,240);
  pdf.text('# '+clean(doc.number||form.number||''), PR, 25, {align:'right'});
  pdf.setFontSize(7.5);
  pdf.text('Invoice Date: '+fmtDate(doc.date||form.date), PR, 31, {align:'right'});
  pdf.text('Payment Date: '+fmtDate(form.paymentDate||today()), PR, 37, {align:'right'});
  if(isGstR){ pdf.setTextColor(AMBER[0],AMBER[1],AMBER[2]); pdf.text('GSTIN: '+clean(C.gst), PR, 43, {align:'right'}); }
  else if(C.pan){ pdf.setTextColor(160,175,210); pdf.text('PAN: '+clean(C.pan), PR, 43, {align:'right'}); }

  var y=54;

  // ── INVOICE FOR / FROM ─────────────────────────────────────
  var HALF=(INNER-5)/2, BX2=PL+HALF+5, BOX_H=46;

  pdf.setFillColor(LBLUE[0],LBLUE[1],LBLUE[2]);
  pdf.roundedRect(PL,y,HALF,BOX_H,2,2,'F');
  pdf.setTextColor(AMBER[0],AMBER[1],AMBER[2]); pdf.setFont('helvetica','bold'); pdf.setFontSize(7);
  pdf.text('INVOICE FOR', PL+4, y+7);
  pdf.setDrawColor(AMBER[0],AMBER[1],AMBER[2]); pdf.setLineWidth(0.4);
  pdf.line(PL+4,y+9,PL+HALF-4,y+9);
  pdf.setTextColor(DARK[0],DARK[1],DARK[2]); pdf.setFont('helvetica','bold'); pdf.setFontSize(10.5);
  pdf.text(clean(doc.clientName||'—').substring(0,30), PL+4, y+17);
  pdf.setFont('helvetica','normal'); pdf.setFontSize(7.5); pdf.setTextColor(GRAY[0],GRAY[1],GRAY[2]);
  var bty=y+23;
  if(doc.clientAddress){
    var al=pdf.splitTextToSize(clean(doc.clientAddress),HALF-8);
    al.slice(0,2).forEach(function(l){ pdf.text(l,PL+4,bty); bty+=5; });
  }
  if(doc.clientGST){ pdf.text('GSTIN: '+clean(doc.clientGST),PL+4,Math.min(bty,y+39)); bty+=5; }
  if(doc.clientEmail) pdf.text(clean(doc.clientEmail),PL+4,Math.min(bty,y+44));

  pdf.setFillColor(NAVY[0],NAVY[1],NAVY[2]);
  pdf.roundedRect(BX2,y,HALF,BOX_H,2,2,'F');
  pdf.setTextColor(AMBER[0],AMBER[1],AMBER[2]); pdf.setFont('helvetica','bold'); pdf.setFontSize(7);
  pdf.text('FROM', BX2+4, y+7);
  pdf.setDrawColor(255,200,100); pdf.setLineWidth(0.3);
  pdf.line(BX2+4,y+9,BX2+HALF-4,y+9);
  pdf.setTextColor(WHITE[0],WHITE[1],WHITE[2]); pdf.setFont('helvetica','bold'); pdf.setFontSize(10.5);
  pdf.text(clean(C.brand||'Go Systematic'), BX2+4, y+17);
  var fromRows=[C.name,C.email,C.phone,
    doc.placeOfSupply?'Place of Supply: '+doc.placeOfSupply:null
  ].filter(Boolean);
  pdf.setFont('helvetica','normal'); pdf.setFontSize(7.5);
  fromRows.forEach(function(r,i){
    var fy=y+23+i*5.5;
    if(fy<=y+43){ pdf.setTextColor(i===0?SLATE[0]:155,i===0?SLATE[1]:170,i===0?SLATE[2]:205); pdf.text(clean(r).substring(0,34),BX2+4,fy); }
  });

  y+=BOX_H+6;

  // ── LINE ITEMS TABLE ───────────────────────────────────────
  // 7 cols summing to INNER=182mm: 7+58+20+14+26+14+43=182
  var C0={x:PL,     w:7 }, C1={x:PL+7,   w:58};
  var C2={x:PL+65,  w:20}, C3={x:PL+85,  w:14};
  var C4={x:PL+99,  w:26}, C5={x:PL+125, w:14};
  var C6={x:PL+139, w:43};

  pdf.setFillColor(NAVY[0],NAVY[1],NAVY[2]); pdf.rect(PL,y,INNER,9,'F');
  pdf.setTextColor(WHITE[0],WHITE[1],WHITE[2]); pdf.setFont('helvetica','bold'); pdf.setFontSize(7.5);
  pdf.text('#',           C0.x+C0.w/2,  y+6.5, {align:'center'});
  pdf.text('Description', C1.x+2,        y+6.5);
  pdf.text('HSN/SAC',     C2.x+C2.w/2,  y+6.5, {align:'center'});
  pdf.text('Qty',         C3.x+C3.w-1,  y+6.5, {align:'right'});
  pdf.text('Rate',        C4.x+C4.w-1,  y+6.5, {align:'right'});
  pdf.text('GST%',        C5.x+C5.w/2,  y+6.5, {align:'center'});
  pdf.text('Amount',      C6.x+C6.w-2,  y+6.5, {align:'right'});
  y+=9;

  var items=doc.lines||doc.items||[];
  pdf.setFont('helvetica','normal');
  items.forEach(function(item,idx){
    var cl=calcLineItem(item);
    var dLines=pdf.splitTextToSize(clean(item.desc||''), C1.w-3);
    var rowH=Math.max(9,dLines.length*5+4);
    y=ensureSpace(y,rowH);
    if(idx%2===0){ pdf.setFillColor(LGRAY[0],LGRAY[1],LGRAY[2]); pdf.rect(PL,y,INNER,rowH,'F'); }
    pdf.setDrawColor(215,225,245); pdf.setLineWidth(0.2); pdf.line(PL,y+rowH,PR,y+rowH);
    pdf.setTextColor(DARK[0],DARK[1],DARK[2]); pdf.setFontSize(8);
    pdf.text(String(idx+1),        C0.x+C0.w/2,  y+6, {align:'center'});
    dLines.forEach(function(dl,di){ pdf.text(dl,C1.x+2,y+6+di*5); });
    pdf.text(clean(item.hsn)||'—', C2.x+C2.w/2,  y+6, {align:'center'});
    pdf.text(String(item.qty||0),  C3.x+C3.w-1,  y+6, {align:'right'});
    pdf.text(fmtNum(item.rate),    C4.x+C4.w-1,  y+6, {align:'right'});
    pdf.text((item.gst||0)+'%',    C5.x+C5.w/2,  y+6, {align:'center'});
    pdf.setFont('helvetica','bold');
    pdf.text(fmtNum(cl.total),     C6.x+C6.w-2,  y+6, {align:'right'});
    pdf.setFont('helvetica','normal');
    y+=rowH;
  });
  y+=5;

  // ── TOTALS ─────────────────────────────────────────────────
  var TOT_ROW=11, grandH=15;
  var totRows=2+(discAmt>0?1:0);
  var totH=totRows*TOT_ROW+grandH+8;
  y=ensureSpace(y,totH);

  pdf.setFillColor(LGRAY[0],LGRAY[1],LGRAY[2]); pdf.roundedRect(PL,y,INNER,totH,2,2,'F');
  var TL=C1.x+2, TR=C6.x+C6.w-2;

  function trow(lbl,val,ty,cr,cg,cb){
    pdf.setFont('helvetica','normal'); pdf.setFontSize(9);
    pdf.setTextColor(GRAY[0],GRAY[1],GRAY[2]); pdf.text(lbl,TL,ty);
    pdf.setFont('helvetica','bold'); pdf.setFontSize(9);
    pdf.setTextColor(cr!=null?cr:DARK[0],cg!=null?cg:DARK[1],cb!=null?cb:DARK[2]);
    pdf.text(val,TR,ty,{align:'right'});
  }
  var tr=y+TOT_ROW;
  trow('Sub Total',fmtAmt(subtotal),tr);
  tr+=TOT_ROW;
  if(discAmt>0){ trow('Discount','- '+fmtAmt(discAmt),tr,20,130,60); tr+=TOT_ROW; }
  trow('Total GST',fmtAmt(gstTotal),tr,AMBER[0],AMBER[1],AMBER[2]);
  var gtY=y+totH-grandH;
  pdf.setFillColor(NAVY[0],NAVY[1],NAVY[2]); pdf.roundedRect(PL,gtY,INNER,grandH,2,2,'F');
  pdf.setTextColor(WHITE[0],WHITE[1],WHITE[2]); pdf.setFont('helvetica','bold'); pdf.setFontSize(11);
  pdf.text('GRAND TOTAL',TL,gtY+10);
  pdf.text(fmtAmt(grand),TR,gtY+10,{align:'right'});
  y+=totH+5;

  // ── AMOUNT IN WORDS ────────────────────────────────────────
  y=ensureSpace(y,12);
  pdf.setFillColor(255,248,232); pdf.roundedRect(PL,y,INNER,9,2,2,'F');
  pdf.setDrawColor(AMBER[0],AMBER[1],AMBER[2]); pdf.setLineWidth(0.4);
  pdf.roundedRect(PL,y,INNER,9,2,2,'S');
  pdf.setTextColor(AMBER[0],AMBER[1],AMBER[2]); pdf.setFont('helvetica','bold'); pdf.setFontSize(7.5);
  pdf.text('Amount in Words:', PL+4, y+6);
  pdf.setTextColor(DARK[0],DARK[1],DARK[2]); pdf.setFont('helvetica','italic'); pdf.setFontSize(8);
  try { pdf.text(amountInWords(grand), PL+48, y+6); } catch(e){}
  y+=13;

  // ── PAYMENT RECEIVED ───────────────────────────────────────
  // Dynamic height: base 20mm + note lines
  var pmtNote=clean(form.paymentNotes||('Received with thanks from '+clean(doc.clientName||'client')+'. Thank you for your business!'));
  pdf.setFontSize(7.5);
  var pnLines=pdf.splitTextToSize(pmtNote, INNER-14);
  var pmtNoteLines=Math.min(pnLines.length,3); // cap at 3 lines
  var pmtH=22+pmtNoteLines*5;
  y=ensureSpace(y,pmtH);

  pdf.setFillColor(GREENBG[0],GREENBG[1],GREENBG[2]); pdf.roundedRect(PL,y,INNER,pmtH,2,2,'F');
  pdf.setDrawColor(GREEN[0],GREEN[1],GREEN[2]); pdf.setLineWidth(0.5);
  pdf.roundedRect(PL,y,INNER,pmtH,2,2,'S');
  pdf.setFillColor(GREEN[0],GREEN[1],GREEN[2]); pdf.roundedRect(PL,y,4,pmtH,2,2,'F');

  // Row 1: label + amount
  pdf.setTextColor(GREEN[0],GREEN[1],GREEN[2]); pdf.setFont('helvetica','bold'); pdf.setFontSize(9.5);
  pdf.text('PAYMENT RECEIVED', PL+9, y+9);
  pdf.setFontSize(13); pdf.text(fmtAmt(grand), TR, y+9, {align:'right'});

  // Row 2: mode + ref | date
  pdf.setFont('helvetica','normal'); pdf.setFontSize(7.5); pdf.setTextColor(DARK[0],DARK[1],DARK[2]);
  var pmtParts=[];
  if(form.paymentMode) pmtParts.push('Mode: '+clean(form.paymentMode));
  if(form.transRef)    pmtParts.push('Ref: '+clean(form.transRef));
  if(pmtParts.length)  pdf.text(pmtParts.join('     '), PL+9, y+17);
  pdf.setTextColor(GRAY[0],GRAY[1],GRAY[2]);
  pdf.text('Date: '+fmtDate(form.paymentDate||today()), TR, y+17, {align:'right'});

  // Row 3+: payment notes — all lines, all fit inside box
  pdf.setTextColor(GRAY[0],GRAY[1],GRAY[2]); pdf.setFontSize(7.5);
  pnLines.slice(0,pmtNoteLines).forEach(function(l,i){
    pdf.text(l, PL+9, y+23+i*5);
  });
  y+=pmtH+6;

  // ── NOTES ──────────────────────────────────────────────────
  if(doc.notes){
    var noteText=clean(doc.notes);
    pdf.setFontSize(7.8);
    var nLines=pdf.splitTextToSize(noteText, INNER-8);
    // Dynamic box height: header (6mm) + lines + padding
    var noteH=8+nLines.length*5+6;
    y=ensureSpace(y,noteH);
    pdf.setFillColor(LGRAY[0],LGRAY[1],LGRAY[2]); pdf.roundedRect(PL,y,INNER,noteH,2,2,'F');
    pdf.setDrawColor(215,225,245); pdf.setLineWidth(0.3);
    pdf.roundedRect(PL,y,INNER,noteH,2,2,'S');
    pdf.setTextColor(AMBER[0],AMBER[1],AMBER[2]); pdf.setFont('helvetica','bold'); pdf.setFontSize(7.5);
    pdf.text('Notes:', PL+4, y+7);
    pdf.setTextColor(50,65,100); pdf.setFont('helvetica','normal'); pdf.setFontSize(7.8);
    // Draw ALL lines — they all fit because box height was calculated from line count
    nLines.forEach(function(l,i){ pdf.text(l, PL+4, y+14+i*5); });
    y+=noteH+5;
  }

  // ── LEGAL DECLARATION ──────────────────────────────────────
  var declText='We declare that this Invoice cum Receipt is raised for services/goods actually '+
    'rendered/delivered. Payment of '+fmtAmt(grand)+' has been received in full against '+
    'this invoice. This document serves as both a valid tax invoice and an acknowledgement '+
    'of payment receipt as required under applicable Indian law.';
  pdf.setFontSize(6.8);
  var dLines=pdf.splitTextToSize(declText, INNER-8);
  var declH=dLines.length*4.5+14;
  y=ensureSpace(y,declH);
  pdf.setFillColor(245,248,253); pdf.roundedRect(PL,y,INNER,declH,2,2,'F');
  pdf.setDrawColor(180,195,230); pdf.setLineWidth(0.3);
  pdf.roundedRect(PL,y,INNER,declH,2,2,'S');
  pdf.setTextColor(NAVY[0],NAVY[1],NAVY[2]); pdf.setFont('helvetica','bold'); pdf.setFontSize(7);
  pdf.text('DECLARATION', PL+4, y+8);
  pdf.setFont('helvetica','normal'); pdf.setFontSize(6.8); pdf.setTextColor(80,95,130);
  dLines.forEach(function(l,i){ pdf.text(l, PL+4, y+14+i*4.5); });
  y+=declH+4;

  // ── FOOTER ─────────────────────────────────────────────────
  // Footer always at the bottom of the LAST page
  var finalFY=pdf.internal.pageSize.getHeight()-20;
  pdf.setFillColor(NAVY[0],NAVY[1],NAVY[2]); pdf.rect(0,finalFY,W,20,'F');
  pdf.setFillColor(AMBER[0],AMBER[1],AMBER[2]); pdf.rect(0,finalFY,W/2,2,'F');
  pdf.setFillColor(GREEN[0],GREEN[1],GREEN[2]);  pdf.rect(W/2,finalFY,W/2,2,'F');
  pdf.setTextColor(WHITE[0],WHITE[1],WHITE[2]); pdf.setFont('helvetica','bold'); pdf.setFontSize(9);
  pdf.text(clean(C.brand||'Go Systematic'), PL, finalFY+8);
  pdf.setFont('helvetica','normal'); pdf.setFontSize(6.5); pdf.setTextColor(SLATE[0],SLATE[1],SLATE[2]);
  pdf.text(clean(C.name||'Automation Pursuits LLP'), PL, finalFY+13);
  if(C.udyam) pdf.text('Udyam: '+clean(C.udyam), PL, finalFY+17.5);
  pdf.setTextColor(140,158,195); pdf.setFontSize(7);
  pdf.text('This is a computer-generated Invoice cum Receipt — No physical signature required', W/2, finalFY+9, {align:'center'});
  if(C.email) pdf.text(clean(C.email), W/2, finalFY+15, {align:'center'});
  pdf.setTextColor(SLATE[0],SLATE[1],SLATE[2]); pdf.setFont('helvetica','normal'); pdf.setFontSize(7);
  if(isGstR) pdf.text('GSTIN: '+clean(C.gst), PR, finalFY+9,  {align:'right'});
  if(C.pan)  pdf.text('PAN: ' +clean(C.pan),  PR, isGstR?finalFY+15:finalFY+9, {align:'right'});

  pdf.save(clean(doc.number||'ICR')+'_'+clean(doc.clientName||'').split(' ').join('_')+'_InvoiceCumReceipt.pdf');
}

function exportClientStatementPDF(clientName, invoices, receipts, fyFilter) {
  var jsPDF = window.jspdf.jsPDF;
  var pdf = new jsPDF({ unit:'mm', format:'a4' });
  var W=210, PL=14, PR=196, INNER=182;
  var NAVY=[13,26,58], AMBER=[188,113,31], WHITE=[255,255,255], GRAY=[100,115,135], DARK=[20,32,65], SLATE=[175,188,215];
  var GREEN=[20,130,70], LGRAY=[245,248,253];

  var totalBilled=invoices.reduce(function(a,b){return a+(b.grand||0);},0);
  var totalRec=receipts.reduce(function(a,b){return a+(parseFloat(b.amount)||0);},0);
  var outstanding=totalBilled-totalRec;

  // Header
  pdf.setFillColor(NAVY[0],NAVY[1],NAVY[2]); pdf.rect(0,0,W,36,'F');
  pdf.setFillColor(AMBER[0],AMBER[1],AMBER[2]); pdf.rect(0,36,W,2,'F');
  try { pdf.addImage('data:image/png;base64,'+ICON_B64,'PNG',PL,4,24,24); } catch(e){}
  pdf.setTextColor(WHITE[0],WHITE[1],WHITE[2]); pdf.setFont('helvetica','bold'); pdf.setFontSize(16);
  pdf.text('CLIENT STATEMENT', PL+28, 15);
  pdf.setFont('helvetica','normal'); pdf.setFontSize(8); pdf.setTextColor(SLATE[0],SLATE[1],SLATE[2]);
  pdf.text('Go Systematic — Automation Pursuits LLP', PL+28, 22);
  pdf.text('Period: '+(fyFilter||'All Years')+'   Generated: '+new Date().toLocaleDateString('en-IN'), PL+28, 28);
  pdf.setTextColor(AMBER[0],AMBER[1],AMBER[2]); pdf.setFont('helvetica','bold'); pdf.setFontSize(13);
  pdf.text(clientName, PR, 18, {align:'right'});
  pdf.setFont('helvetica','normal'); pdf.setFontSize(8); pdf.setTextColor(SLATE[0],SLATE[1],SLATE[2]);
  pdf.text('Account Statement', PR, 25, {align:'right'});

  var y=44;

  // Summary boxes
  var bw=(INNER-10)/3;
  [['Total Billed','Rs. '+Number(totalBilled).toLocaleString('en-IN',{minimumFractionDigits:2}),[13,26,58]],
   ['Amount Received','Rs. '+Number(totalRec).toLocaleString('en-IN',{minimumFractionDigits:2}),[20,130,70]],
   ['Outstanding','Rs. '+Number(outstanding).toLocaleString('en-IN',{minimumFractionDigits:2}),outstanding>0?[180,40,40]:GREEN]
  ].forEach(function(box,i){
    var bx=PL+i*(bw+5);
    pdf.setFillColor(LGRAY[0],LGRAY[1],LGRAY[2]); pdf.roundedRect(bx,y,bw,18,2,2,'F');
    pdf.setFillColor(box[2][0],box[2][1],box[2][2]); pdf.roundedRect(bx,y,bw,2,1,1,'F');
    pdf.setTextColor(GRAY[0],GRAY[1],GRAY[2]); pdf.setFont('helvetica','normal'); pdf.setFontSize(7);
    pdf.text(box[0], bx+4, y+8);
    pdf.setTextColor(box[2][0],box[2][1],box[2][2]); pdf.setFont('helvetica','bold'); pdf.setFontSize(10);
    pdf.text(box[1], bx+4, y+15);
  });
  y+=24;

  // Transaction table
  pdf.setFillColor(NAVY[0],NAVY[1],NAVY[2]); pdf.rect(PL,y,INNER,8,'F');
  pdf.setTextColor(WHITE[0],WHITE[1],WHITE[2]); pdf.setFont('helvetica','bold'); pdf.setFontSize(7.5);
  pdf.text('Date', PL+2, y+5.5);
  pdf.text('Document #', PL+22, y+5.5);
  pdf.text('Type', PL+60, y+5.5);
  pdf.text('Amount', PL+120, y+5.5, {align:'right'});
  pdf.text('Status', PR, y+5.5, {align:'right'});
  y+=8;

  var rows=[
    ...invoices.map(function(i){return {date:i.date,num:i.number,type:i.type,amt:i.grand||0,status:i.status,isRec:false};}),
    ...receipts.map(function(r){return {date:r.date,num:r.number||'',type:'Payment Receipt',amt:parseFloat(r.amount)||0,status:'Received',isRec:true};})
  ].sort(function(a,b){return new Date(a.date)-new Date(b.date);});

  pdf.setFont('helvetica','normal');
  rows.forEach(function(row,idx){
    if(y>268){ pdf.addPage(); y=20; }
    if(idx%2===0){ pdf.setFillColor(LGRAY[0],LGRAY[1],LGRAY[2]); pdf.rect(PL,y,INNER,7,'F'); }
    pdf.setDrawColor(215,225,245); pdf.setLineWidth(0.2); pdf.line(PL,y+7,PR,y+7);
    pdf.setTextColor(DARK[0],DARK[1],DARK[2]); pdf.setFontSize(7.5);
    pdf.text(new Date(row.date).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'2-digit'})||'—', PL+2, y+5);
    pdf.text((row.num||'').substring(0,20), PL+22, y+5);
    pdf.text(row.type.substring(0,22), PL+60, y+5);
    if(row.isRec){ pdf.setTextColor(GREEN[0],GREEN[1],GREEN[2]); } else { pdf.setTextColor(DARK[0],DARK[1],DARK[2]); }
    pdf.setFont('helvetica','bold');
    pdf.text('Rs. '+Number(row.amt).toLocaleString('en-IN',{minimumFractionDigits:2}), PL+120, y+5, {align:'right'});
    pdf.setFont('helvetica','normal'); pdf.setTextColor(GRAY[0],GRAY[1],GRAY[2]);
    pdf.text(row.status||'—', PR, y+5, {align:'right'});
    y+=7;
  });

  // Footer totals
  y+=4;
  pdf.setFillColor(NAVY[0],NAVY[1],NAVY[2]); pdf.roundedRect(PL,y,INNER,12,2,2,'F');
  pdf.setTextColor(WHITE[0],WHITE[1],WHITE[2]); pdf.setFont('helvetica','bold'); pdf.setFontSize(9);
  pdf.text('OUTSTANDING BALANCE', PL+4, y+8);
  var outColor = outstanding>0?[255,140,140]:null;
  if(outColor){pdf.setTextColor(outColor[0],outColor[1],outColor[2]);}else{pdf.setTextColor(GREEN[0],GREEN[1],GREEN[2]);}
  pdf.text('Rs. '+Number(outstanding).toLocaleString('en-IN',{minimumFractionDigits:2}), PR, y+8, {align:'right'});

  // Footer
  var FY=pdf.internal.pageSize.getHeight()-14;

// ─── NUMBER TO WORDS ───
function numToWords(n) {
  const a = ['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const b = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  if(n===0) return 'Zero';
  if(n<0) return 'Minus ' + numToWords(-n);
  let str = '';
  if(Math.floor(n/10000000)) { str += numToWords(Math.floor(n/10000000)) + ' Crore '; n %= 10000000; }
  if(Math.floor(n/100000)) { str += numToWords(Math.floor(n/100000)) + ' Lakh '; n %= 100000; }
  if(Math.floor(n/1000)) { str += numToWords(Math.floor(n/1000)) + ' Thousand '; n %= 1000; }
  if(Math.floor(n/100)) { str += numToWords(Math.floor(n/100)) + ' Hundred '; n %= 100; }
  if(n>0) { str += (str?' and ':'') + (n<20 ? a[n] : b[Math.floor(n/10)] + (n%10 ? ' '+a[n%10] : '')); }
  return str.trim();
}
function amountInWords(amount) {
  const n = Math.round(amount * 100);
  const rupees = Math.floor(n/100);
  const paise = n % 100;
  let words = 'Rupees ' + numToWords(rupees);
  if(paise > 0) words += ' and ' + numToWords(paise) + ' Paise';
  return words + ' Only';
}

function gstReal(C) {

}

  // ── AMOUNT HERO BOX ─────────────────────────────────────
  // Large green amount display — the most important element
  pdf.setFillColor(GREENBG[0],GREENBG[1],GREENBG[2]);
  pdf.roundedRect(PL,y,W-2*PL,28,3,3,'F');
  pdf.setDrawColor(GREEN[0],GREEN[1],GREEN[2]); pdf.setLineWidth(0.6);
  pdf.roundedRect(PL,y,W-2*PL,28,3,3,'S');
  // Green left bar
  pdf.setFillColor(GREEN[0],GREEN[1],GREEN[2]);
  pdf.roundedRect(PL,y,5,28,2,2,'F');

  pdf.setTextColor(GREEN[0],GREEN[1],GREEN[2]);
  pdf.setFont('helvetica','bold'); pdf.setFontSize(8);
  pdf.text('AMOUNT RECEIVED', PL+10, y+9);
  pdf.setFontSize(22);
  pdf.text(fmtAmt(amount), PL+10, y+22);

  // Amount in words — right side of hero box
  pdf.setFont('helvetica','normal'); pdf.setFontSize(7.5); pdf.setTextColor(GRAY[0],GRAY[1],GRAY[2]);
  try {
    var words = amountInWords(amount);
    var wLines = pdf.splitTextToSize(words, 80);
    pdf.text('In Words:', PR-82, y+9);
    wLines.slice(0,2).forEach(function(l,i){ pdf.text(l, PR-82, y+15+i*5); });
  } catch(e) {}
  y+=34;

  // ── RECEIVED FROM / OUR DETAILS (two columns) ───────────
  var HALF=(W-2*PL-5)/2;
  var BX2=PL+HALF+5;
  var boxH=42;

  // Received From (left — blue)
  pdf.setFillColor(LBLUE[0],LBLUE[1],LBLUE[2]);
  pdf.roundedRect(PL,y,HALF,boxH,2,2,'F');
  pdf.setTextColor(AMBER[0],AMBER[1],AMBER[2]); pdf.setFont('helvetica','bold'); pdf.setFontSize(7);
  pdf.text('RECEIVED FROM', PL+4, y+7);
  pdf.setDrawColor(AMBER[0],AMBER[1],AMBER[2]); pdf.setLineWidth(0.4);
  pdf.line(PL+4,y+9,PL+HALF-4,y+9);
  pdf.setTextColor(DARK[0],DARK[1],DARK[2]); pdf.setFont('helvetica','bold'); pdf.setFontSize(10.5);
  pdf.text((r.clientName||'—').substring(0,30), PL+4, y+16);
  pdf.setFont('helvetica','normal'); pdf.setFontSize(8); pdf.setTextColor(GRAY[0],GRAY[1],GRAY[2]);
  if(r.invoiceRef){ pdf.text('Against Invoice: '+r.invoiceRef, PL+4, y+23); }
  pdf.setFont('helvetica','bold'); pdf.setFontSize(9); pdf.setTextColor(GREEN[0],GREEN[1],GREEN[2]);
  pdf.text(fmtAmt(amount), PL+4, y+33);
  pdf.setFont('helvetica','normal'); pdf.setFontSize(7.5); pdf.setTextColor(GRAY[0],GRAY[1],GRAY[2]);
  pdf.text('Full payment received', PL+4, y+39);

  // Payment Details (right — navy)
  pdf.setFillColor(NAVY[0],NAVY[1],NAVY[2]);
  pdf.roundedRect(BX2,y,HALF,boxH,2,2,'F');
  pdf.setTextColor(AMBER[0],AMBER[1],AMBER[2]); pdf.setFont('helvetica','bold'); pdf.setFontSize(7);
  pdf.text('PAYMENT DETAILS', BX2+4, y+7);
  pdf.setDrawColor(255,200,100); pdf.setLineWidth(0.3);
  pdf.line(BX2+4,y+9,BX2+HALF-4,y+9);

  var prows=[
    ['Mode:',    r.mode||'—'],
    ['Ref / UTR:',r.transRef||'—'],
    ['Date:',    fmtDate(r.date)],
  ];
  prows.forEach(function(row,i){
    var ry=y+17+i*8;
    pdf.setTextColor(SLATE[0],SLATE[1],SLATE[2]); pdf.setFont('helvetica','normal'); pdf.setFontSize(7.5);
    pdf.text(row[0], BX2+4, ry);
    pdf.setTextColor(WHITE[0],WHITE[1],WHITE[2]); pdf.setFont('helvetica','bold'); pdf.setFontSize(8);
    pdf.text(row[1].substring(0,22), BX2+28, ry);
  });
  y+=boxH+6;

  // ── BANK DETAILS (for client records) ───────────────────
  if(C.bank && C.bank.name && C.bank.account){
    pdf.setFillColor(LGRAY[0],LGRAY[1],LGRAY[2]);
    pdf.roundedRect(PL,y,W-2*PL,36,2,2,'F');
    pdf.setDrawColor(215,225,245); pdf.setLineWidth(0.3);
    pdf.roundedRect(PL,y,W-2*PL,36,2,2,'S');
    pdf.setTextColor(AMBER[0],AMBER[1],AMBER[2]); pdf.setFont('helvetica','bold'); pdf.setFontSize(7.5);
    pdf.text('OUR BANK DETAILS', PL+4, y+8);
    pdf.setFont('helvetica','normal'); pdf.setFontSize(7); pdf.setTextColor(GRAY[0],GRAY[1],GRAY[2]);
    pdf.text('(Please use these details for future payments)', PL+44, y+8);
    pdf.setDrawColor(AMBER[0],AMBER[1],AMBER[2]); pdf.setLineWidth(0.3);
    pdf.line(PL+4,y+10,PR,y+10);

    // Two-column bank layout
    var bL=PL+4, bV=PL+36;
    var b2L=PL+HALF+5, b2V=PL+HALF+36;
    var brows2=[
      {l:'Account Name:', v:(C.name||'').substring(0,26), x:bL, xv:bV, row:0},
      {l:'Bank Name:',    v:(C.bank.name||'').substring(0,22), x:b2L, xv:b2V, row:0},
      {l:'A/C Number:',   v:C.bank.account, x:bL, xv:bV, row:1},
      {l:'IFSC Code:',    v:(C.bank.ifsc||'').toUpperCase(), x:b2L, xv:b2V, row:1},
      {l:'Branch:',       v:(C.bank.branch||'').substring(0,22), x:bL, xv:bV, row:2},
    ];
    brows2.forEach(function(br){
      var ry=y+17+br.row*7;
      pdf.setTextColor(GRAY[0],GRAY[1],GRAY[2]); pdf.setFont('helvetica','normal'); pdf.setFontSize(7.5);
      pdf.text(br.l, br.x, ry);
      pdf.setTextColor(DARK[0],DARK[1],DARK[2]); pdf.setFont('helvetica','bold');
      pdf.text(br.v, br.xv, ry);
    });
    y+=40;
  }

  // ── ACKNOWLEDGEMENT BOX ──────────────────────────────────
  pdf.setFillColor(NAVY[0],NAVY[1],NAVY[2]);
  pdf.roundedRect(PL,y,W-2*PL,18,2,2,'F');
  pdf.setTextColor(WHITE[0],WHITE[1],WHITE[2]); pdf.setFont('helvetica','bold'); pdf.setFontSize(8.5);
  pdf.text('ACKNOWLEDGEMENT', PL+4, y+8);
  pdf.setFont('helvetica','normal'); pdf.setFontSize(7.5); pdf.setTextColor(SLATE[0],SLATE[1],SLATE[2]);
  var ack = 'We acknowledge receipt of '+fmtAmt(amount)+' from '+(r.clientName||'the client')+
            ' via '+(r.mode||'transfer')+
            (r.transRef?' (Ref: '+r.transRef+')':'')+
            '. This receipt is valid proof of payment.';
  var ackLines = pdf.splitTextToSize(ack, W-2*PL-8);
  ackLines.slice(0,2).forEach(function(l,i){ pdf.text(l,PL+4,y+13+i*4.5); });
  y+=22;

  // ── NOTES (if any) ──────────────────────────────────────
  if(r.notes && !r.notes.startsWith('Auto-generated')){
    var noteLines = pdf.splitTextToSize(r.notes, W-2*PL-22);
    var noteH = Math.max(10, noteLines.length*5+8);
    pdf.setFillColor(LGRAY[0],LGRAY[1],LGRAY[2]);
    pdf.roundedRect(PL,y,W-2*PL,noteH,2,2,'F');
    pdf.setTextColor(AMBER[0],AMBER[1],AMBER[2]); pdf.setFont('helvetica','bold'); pdf.setFontSize(7.5);
    pdf.text('Notes:', PL+4, y+7);
    pdf.setTextColor(50,65,100); pdf.setFont('helvetica','normal'); pdf.setFontSize(7.8);
    noteLines.slice(0,3).forEach(function(l,i){ pdf.text(l,PL+22,y+7+i*5); });
    y+=noteH+4;
  }

  // ── FOOTER ──────────────────────────────────────────────
  var FY=277;
  pdf.setFillColor(NAVY[0],NAVY[1],NAVY[2]); pdf.rect(0,FY,W,20,'F');
  pdf.setFillColor(GREEN[0],GREEN[1],GREEN[2]); pdf.rect(0,FY,W,2,'F');

  pdf.setTextColor(WHITE[0],WHITE[1],WHITE[2]); pdf.setFont('helvetica','bold'); pdf.setFontSize(9);
  pdf.text(C.brand||'Go Systematic', PL, FY+8);
  pdf.setFont('helvetica','normal'); pdf.setFontSize(6.5); pdf.setTextColor(SLATE[0],SLATE[1],SLATE[2]);
  pdf.text(C.name||'Automation Pursuits LLP', PL, FY+13);
  if(C.udyam) pdf.text('Udyam: '+C.udyam, PL, FY+17.5);

  pdf.setTextColor(140,158,195); pdf.setFontSize(7);
  pdf.text('This is a computer-generated payment receipt — No physical signature required', W/2, FY+9, {align:'center'});
  if(C.email) pdf.text(C.email, W/2, FY+15, {align:'center'});

  pdf.setTextColor(SLATE[0],SLATE[1],SLATE[2]); pdf.setFont('helvetica','normal'); pdf.setFontSize(7);
  if(isGstR) pdf.text('GSTIN: '+C.gst, PR, FY+9, {align:'right'});
  if(C.pan) pdf.text('PAN: '+C.pan, PR, isGstR?FY+15:FY+9, {align:'right'});

  pdf.save('Receipt_'+(r.number||'REC')+'.pdf');
}

function exportAllPDF(invoices, company) {
  const C = company || DEFAULT_COMPANY;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'mm', format:'a4' });
  const W=210, ml=14, mr=196;
  const NAVY=[13,26,58], AMBER=[188,113,31];
  doc.setFillColor(...NAVY); doc.rect(0,0,W,32,'F');
  doc.setFillColor(...AMBER); doc.rect(0,32,W,2,'F');
  try { doc.addImage('data:image/jpeg;base64,'+LOGO_B64,'JPEG',ml,3,26,26); } catch(e){}
  doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(16);
  doc.text((C.brand||'Go Systematic') + ' — Invoice Summary', ml+30, 14);
  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(170,180,210);
  doc.text('Generated: ' + new Date().toLocaleString('en-IN'), ml+30, 21);
  doc.text('Total documents: ' + invoices.length, mr, 21, {align:'right'});
  let y=40;
  doc.setFillColor(...NAVY); doc.rect(ml,y,W-2*ml,7,'F');
  doc.setTextColor(255,255,255); doc.setFontSize(7); doc.setFont('helvetica','bold');
  const xs=[ml+2,ml+10,ml+38,ml+66,ml+86,ml+138,ml+162];
  ['#','Number','Type','Date','Client','Grand Total','Status'].forEach((h,i)=>doc.text(h,xs[i],y+4.5));
  y+=7;
  invoices.forEach((inv,i)=>{
    if(i%2===0){doc.setFillColor(245,248,253);doc.rect(ml,y,W-2*ml,6,'F');}
    doc.setTextColor(30,40,70); doc.setFontSize(7); doc.setFont('helvetica','normal');
    [i+1,inv.number,inv.type,fmtDate(inv.date),(inv.clientName||'').substring(0,20),'₹'+Number(inv.grand||0).toLocaleString('en-IN',{minimumFractionDigits:2}),inv.status||'Draft'].forEach((v,j)=>doc.text(`${v}`,xs[j],y+4));
    y+=6;
    if(y>270){doc.addPage();y=20;}
  });
  const total=invoices.reduce((a,b)=>a+(b.grand||0),0);
  y+=4;
  doc.setFillColor(...NAVY); doc.roundedRect(ml,y,W-2*ml,10,2,2,'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(255,255,255);
  doc.text('TOTAL', ml+4, y+6.5);
  doc.text('₹ '+Number(total).toLocaleString('en-IN',{minimumFractionDigits:2}), mr, y+6.5, {align:'right'});
  doc.setFillColor(...NAVY); doc.rect(0,276,W,21,'F');
  doc.setFillColor(...AMBER); doc.rect(0,276,W,1.5,'F');
  doc.setTextColor(170,180,210); doc.setFont('helvetica','normal'); doc.setFontSize(7);
  doc.text((C.name||'Automation Pursuits LLP')+' — '+(C.brand||'Go Systematic'), ml, 284);
  doc.text('This is a computer-generated summary', W/2, 284, {align:'center'});
  doc.save('GoSystematic_InvoiceSummary_' + today() + '.pdf');
}
