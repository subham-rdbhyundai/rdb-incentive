<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Go Systematic — Accounts Dashboard</title>
<meta name="description" content="Go Systematic Accounts — Invoices, Receipts, Expenses"/>
<meta name="theme-color" content="#0D1A3A"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="GS Accounts"/>
<link rel="apple-touch-icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=="/>
<link rel="manifest" href="manifest.json"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  :root {
    --navy: #1A2B5F;
    --navy-dark: #0D1A3A;
    --blue: #2C76C0;
    --blue-light: #4A9FE8;
    --amber: #BC711F;
    --amber-light: #D4891F;
    --brown: #79340A;
    --white: #FFFFFF;
    --off-white: #F5F7FA;
    --surface: #FFFFFF;
    --surface-alt: #EEF2F8;
    --border: #D0DCF0;
    --text-primary: #1A2B5F;
    --text-secondary: #4A5A7A;
    --text-muted: #7A8AAA;
    --success: #1A7A4A;
    --success-bg: #E6F4EE;
    --warning: #B85C00;
    --warning-bg: #FEF3E6;
    --danger: #B02020;
    --danger-bg: #FDEAEA;
    --shadow-sm: 0 1px 4px rgba(26,43,95,0.08);
    --shadow-md: 0 4px 16px rgba(26,43,95,0.12);
    --shadow-lg: 0 8px 32px rgba(26,43,95,0.16);
    --radius: 10px;
    --radius-sm: 6px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: 'Inter', sans-serif;
    background: var(--off-white);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
    max-width: 100vw;
  }
  html { overflow-x: hidden; }
  #root { overflow-x: hidden; max-width: 100vw; }

  /* SIDEBAR */
  .sidebar {
    position: fixed; top:0; left:0; bottom:0;
    width: 240px;
    background: var(--navy-dark);
    display: flex; flex-direction: column;
    z-index: 100;
    box-shadow: var(--shadow-lg);
  }
  .sidebar-logo {
    padding: 20px 20px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    display: flex; align-items: center; gap: 10px;
  }
  .sidebar-logo img { height: 36px; }
  .sidebar-logo-text {
    font-family: 'Rajdhani', sans-serif;
    font-size: 17px; font-weight: 700;
    color: var(--white); line-height: 1.1;
  }
  .sidebar-logo-sub {
    font-size: 9px; letter-spacing: 1.5px;
    color: var(--amber); font-weight: 500;
    text-transform: uppercase;
  }
  .sidebar-section-label {
    font-size: 9px; font-weight: 600; letter-spacing: 1.5px;
    text-transform: uppercase; color: rgba(255,255,255,0.35);
    padding: 18px 18px 6px;
  }
  .sidebar-nav { flex: 1; overflow-y: auto; padding-bottom: 16px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 18px; cursor: pointer;
    color: rgba(255,255,255,0.65);
    font-size: 13.5px; font-weight: 500;
    border-left: 3px solid transparent;
    transition: all 0.15s;
    text-decoration: none;
  }
  .nav-item:hover { background: rgba(255,255,255,0.06); color: var(--white); }
  .nav-item.active {
    background: rgba(44,118,192,0.18);
    color: var(--white);
    border-left-color: var(--amber);
  }
  .nav-item .icon { font-size: 16px; width: 20px; text-align: center; }
  .sidebar-footer {
    padding: 14px 18px;
    border-top: 1px solid rgba(255,255,255,0.08);
    font-size: 11px; color: rgba(255,255,255,0.3);
    text-align: center;
  }
  .sidebar-footer strong { color: rgba(255,255,255,0.5); }

  /* MAIN */
  .main { margin-left: 240px; min-height: 100vh; }
  .topbar {
    background: var(--white);
    padding: 0 28px;
    height: 60px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 50;
    box-shadow: var(--shadow-sm);
  }
  .topbar-title {
    font-family: 'Rajdhani', sans-serif;
    font-size: 20px; font-weight: 700; color: var(--navy);
  }
  .topbar-actions { display: flex; align-items: center; gap: 12px; }
  .content { padding: 28px; }

  /* BUTTONS */
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 16px; border-radius: var(--radius-sm);
    font-size: 13px; font-weight: 600; cursor: pointer;
    border: none; transition: all 0.15s; font-family: 'Inter', sans-serif;
  }
  .btn-primary { background: var(--navy); color: var(--white); }
  .btn-primary:hover { background: var(--blue); }
  .btn-amber { background: var(--amber); color: var(--white); }
  .btn-amber:hover { background: var(--amber-light); }
  .btn-outline {
    background: transparent; color: var(--navy);
    border: 1.5px solid var(--border);
  }
  .btn-outline:hover { border-color: var(--blue); color: var(--blue); }
  .btn-danger { background: var(--danger); color: var(--white); }
  .btn-danger:hover { background: #900; }
  .btn-sm { padding: 5px 11px; font-size: 12px; }
  .btn-ghost { background: transparent; color: var(--text-secondary); border: none; padding: 6px 10px; }
  .btn-ghost:hover { color: var(--navy); background: var(--surface-alt); }

  /* CARDS */
  .card {
    background: var(--white);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
  }
  .card-header {
    padding: 18px 20px 14px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .card-title {
    font-family: 'Rajdhani', sans-serif;
    font-size: 16px; font-weight: 700; color: var(--navy);
  }
  .card-body { padding: 20px; }

  /* STATS */
  .stats-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: var(--white);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    padding: 20px;
    box-shadow: var(--shadow-sm);
    position: relative; overflow: hidden;
  }
  .stat-card::before {
    content: ''; position: absolute;
    top: 0; left: 0; right: 0; height: 3px;
  }
  .stat-card.navy::before { background: var(--navy); }
  .stat-card.blue::before { background: var(--blue); }
  .stat-card.amber::before { background: var(--amber); }
  .stat-card.brown::before { background: var(--brown); }
  .stat-label { font-size: 11px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; }
  .stat-value { font-family: 'Rajdhani', sans-serif; font-size: 28px; font-weight: 700; color: var(--navy); line-height: 1; }
  .stat-sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
  .stat-icon { position: absolute; top: 18px; right: 18px; font-size: 28px; opacity: 0.1; }

  /* TABLE */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: left; padding: 10px 14px;
    background: var(--surface-alt);
    font-size: 11px; font-weight: 600; letter-spacing: 0.6px;
    text-transform: uppercase; color: var(--text-secondary);
    border-bottom: 1.5px solid var(--border);
  }
  td {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    color: var(--text-primary);
    vertical-align: middle;
  }
  tr:hover td { background: var(--surface-alt); }
  tr:last-child td { border-bottom: none; }

  /* BADGES */
  .badge {
    display: inline-block;
    padding: 3px 9px; border-radius: 50px;
    font-size: 11px; font-weight: 600;
  }
  .badge-success { background: var(--success-bg); color: var(--success); }
  .badge-warning { background: var(--warning-bg); color: var(--warning); }
  .badge-danger { background: var(--danger-bg); color: var(--danger); }
  .badge-blue { background: #E6F0FB; color: var(--blue); }
  .badge-navy { background: #E8ECF5; color: var(--navy); }
  .badge-amber { background: #FEF3E6; color: var(--amber); }

  /* FORM */
  .form-group { margin-bottom: 16px; }
  .form-label {
    display: block; font-size: 12px; font-weight: 600;
    color: var(--text-secondary); margin-bottom: 5px; letter-spacing: 0.3px;
  }
  .form-control {
    width: 100%; padding: 9px 12px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 13px; font-family: 'Inter', sans-serif;
    color: var(--text-primary);
    background: var(--white);
    transition: border-color 0.15s;
    outline: none;
  }
  .form-control:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(44,118,192,0.1); }
  select.form-control { cursor: pointer; }
  .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }

  /* MODAL */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(13,26,58,0.6);
    z-index: 200;
    display: flex; align-items: flex-start; justify-content: center;
    padding: 40px 20px; overflow-y: auto;
    backdrop-filter: blur(2px);
  }
  .modal {
    background: var(--white);
    border-radius: var(--radius);
    width: 100%; max-width: 780px;
    box-shadow: var(--shadow-lg);
    animation: slideUp 0.2s ease;
  }
  .modal-xl { max-width: 960px; }
  @keyframes slideUp {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .modal-header {
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    background: var(--navy-dark); border-radius: var(--radius) var(--radius) 0 0;
  }
  .modal-header h2 {
    font-family: 'Rajdhani', sans-serif;
    font-size: 18px; font-weight: 700; color: var(--white);
  }
  .modal-close {
    background: rgba(255,255,255,0.1); border: none;
    color: var(--white); width: 30px; height: 30px;
    border-radius: 50%; cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
  }
  .modal-close:hover { background: rgba(255,255,255,0.2); }
  .modal-body { padding: 24px; }
  .modal-footer {
    padding: 16px 24px;
    border-top: 1px solid var(--border);
    display: flex; align-items: center; justify-content: flex-end; gap: 10px;
    background: var(--off-white); border-radius: 0 0 var(--radius) var(--radius);
  }

  /* INVOICE LINE ITEMS */
  .line-items-table { width: 100%; border-collapse: collapse; }
  .line-items-table th {
    background: var(--navy-dark); color: var(--white);
    font-size: 11px; letter-spacing: 0.5px;
  }
  .line-items-table input { border: none; background: transparent; width: 100%; outline: none; font-size: 13px; padding: 2px 4px; font-family: 'Inter', sans-serif; }
  .line-items-table td { border-bottom: 1px solid var(--border); padding: 8px 10px; }
  .li-desc { min-width: 200px; }
  .li-num { min-width: 80px; }

  /* GITHUB CONFIG */
  .config-banner {
    background: linear-gradient(135deg, var(--navy-dark), var(--navy));
    border-radius: var(--radius);
    padding: 28px 32px;
    color: var(--white);
    margin-bottom: 24px;
    border: 1px solid rgba(44,118,192,0.3);
  }
  .config-banner h2 {
    font-family: 'Rajdhani', sans-serif;
    font-size: 22px; font-weight: 700; margin-bottom: 6px;
  }
  .config-banner p { font-size: 13.5px; color: rgba(255,255,255,0.7); margin-bottom: 20px; line-height: 1.6; }

  /* EMPTY STATE */
  .empty-state {
    text-align: center; padding: 60px 40px;
    color: var(--text-muted);
  }
  .empty-state .icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }
  .empty-state h3 { font-size: 16px; color: var(--text-secondary); margin-bottom: 6px; }
  .empty-state p { font-size: 13px; margin-bottom: 20px; }

  /* INVOICE PREVIEW */
  .invoice-preview {
    font-size: 13px;
    font-family: 'Inter', sans-serif;
  }
  .inv-header-bar {
    background: var(--navy-dark);
    color: var(--white);
    padding: 24px 28px;
    display: flex; justify-content: space-between; align-items: flex-start;
    border-radius: var(--radius) var(--radius) 0 0;
  }
  .inv-company-name {
    font-family: 'Rajdhani', sans-serif;
    font-size: 24px; font-weight: 700;
  }
  .inv-tagline { font-size: 10px; letter-spacing: 2px; color: var(--amber); text-transform: uppercase; }
  .inv-title { font-size: 30px; font-weight: 800; text-align: right; color: var(--amber); font-family: 'Rajdhani', sans-serif; }
  .inv-number { font-size: 13px; color: rgba(255,255,255,0.6); text-align: right; }
  .inv-body { padding: 24px 28px; }
  .inv-parties { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 20px; }
  .inv-party-label { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--amber); margin-bottom: 6px; }
  .inv-party-name { font-weight: 700; font-size: 15px; color: var(--navy); margin-bottom: 3px; }
  .inv-party-detail { font-size: 12px; color: var(--text-secondary); line-height: 1.6; }
  .inv-meta { display: flex; gap: 28px; padding: 12px 16px; background: var(--off-white); border-radius: var(--radius-sm); margin-bottom: 20px; border: 1px solid var(--border); }
  .inv-meta-item { }
  .inv-meta-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-muted); font-weight: 600; }
  .inv-meta-val { font-size: 13px; font-weight: 600; color: var(--navy); }
  .inv-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
  .inv-table th { background: var(--navy); color: white; padding: 9px 12px; text-align: left; font-size: 11px; letter-spacing: 0.5px; }
  .inv-table td { padding: 9px 12px; border-bottom: 1px solid var(--border); font-size: 12.5px; }
  .inv-table tr:last-child td { border-bottom: none; }
  .inv-totals { display: flex; justify-content: flex-end; }
  .inv-totals-box { min-width: 280px; }
  .inv-total-row { display: flex; justify-content: space-between; padding: 5px 0; font-size: 13px; }
  .inv-total-row.grand { font-size: 16px; font-weight: 700; color: var(--navy); border-top: 2px solid var(--navy); padding-top: 10px; margin-top: 6px; font-family: 'Rajdhani', sans-serif; }
  .inv-footer { background: var(--navy-dark); color: rgba(255,255,255,0.5); padding: 14px 28px; font-size: 11px; display: flex; justify-content: space-between; border-radius: 0 0 var(--radius) var(--radius); }

  /* TAGS */  
  .tabs { display: flex; gap: 4px; padding: 4px; background: var(--surface-alt); border-radius: var(--radius-sm); width: fit-content; margin-bottom: 20px; }
  .tab-btn { padding: 7px 16px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px; font-weight: 500; font-family: 'Inter', sans-serif; color: var(--text-secondary); background: transparent; transition: all 0.15s; }
  .tab-btn.active { background: var(--white); color: var(--navy); font-weight: 600; box-shadow: var(--shadow-sm); }

  /* ALERT */
  .alert { padding: 12px 16px; border-radius: var(--radius-sm); font-size: 13px; margin-bottom: 16px; display: flex; align-items: flex-start; gap: 10px; }
  .alert-info { background: #E6F0FB; color: var(--blue); border: 1px solid #B0CFF5; }
  .alert-warning { background: var(--warning-bg); color: var(--warning); border: 1px solid #F5CC99; }
  .alert-success { background: var(--success-bg); color: var(--success); border: 1px solid #99D4BB; }

  /* SEARCH BAR */
  .search-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .search-input-wrap { position: relative; flex: 1; max-width: 320px; }
  .search-input-wrap .icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 14px; }
  .search-input { padding: 8px 12px 8px 32px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; font-family: 'Inter', sans-serif; outline: none; width: 100%; color: var(--text-primary); background: var(--white); }
  .search-input:focus { border-color: var(--blue); }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .section-title { font-family: 'Rajdhani', sans-serif; font-size: 22px; font-weight: 700; color: var(--navy); margin-bottom: 6px; }
  .section-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }

  .divider { height: 1px; background: var(--border); margin: 20px 0; }
  .flex-between { display: flex; align-items: center; justify-content: space-between; }
  .flex-gap { display: flex; align-items: center; gap: 10px; }
  .text-right { text-align: right; }
  .text-muted { color: var(--text-muted); }
  .font-mono { font-family: 'Rajdhani', sans-serif; font-weight: 700; }
  .amount { font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 14px; }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }


  /* ── TABLET (≤900px) ── */
  @media (max-width: 900px) {
    .sidebar { width: 220px; }
    .main { margin-left: 220px; }
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
    .grid-2 { grid-template-columns: 1fr; }
    .modal { max-width: 96vw; }
    .modal-xl { max-width: 96vw; }
    .form-grid-3 { grid-template-columns: 1fr 1fr; }
    .content { padding: 18px; }
  }

  /* ── MOBILE (≤640px) ── */
  @media (max-width: 640px) {
    /* Sidebar hidden — replaced by bottom nav */
    .sidebar { transform: translateX(-100%); transition: transform 0.25s ease; z-index: 300; }
    .sidebar.open { transform: translateX(0); }
    .sidebar-overlay { display: block !important; }
    .main { margin-left: 0; }
    .content { padding: 14px; }

    /* Stats */
    .stats-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat-value { font-size: 20px; }
    .stat-card { padding: 14px; }

    /* Grids collapse */
    .grid-2 { grid-template-columns: 1fr; gap: 12px; }
    .form-grid-2 { grid-template-columns: 1fr; gap: 10px; }
    .form-grid-3 { grid-template-columns: 1fr; gap: 10px; }

    /* Topbar */
    .topbar { padding: 0 14px; height: 52px; }
    .topbar-title { font-size: 16px; }

    /* Tables — horizontal scroll */
    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { min-width: 600px; }
    th, td { padding: 8px 10px; font-size: 12px; }

    /* Modals — full screen on mobile */
    .modal-backdrop { padding: 0; align-items: flex-end; }
    .modal { max-width: 100%; width: 100%; border-radius: 16px 16px 0 0; max-height: 92vh; }
    .modal-xl { max-width: 100%; width: 100%; border-radius: 16px 16px 0 0; max-height: 92vh; }
    .modal-header { border-radius: 16px 16px 0 0; }
    .modal-body { padding: 16px; }
    .modal-footer { padding: 12px 16px; flex-wrap: wrap; gap: 8px; }
    .modal-footer .btn { flex: 1; min-width: 120px; justify-content: center; }

    /* Buttons */
    .btn { padding: 9px 14px; font-size: 13px; }
    .btn-sm { padding: 6px 10px; font-size: 12px; }

    /* Bottom nav bar */
    .bottom-nav { display: flex !important; }

    /* Section titles */
    .section-title { font-size: 18px; }

    /* Tabs — horizontal scroll */
    .tabs { overflow-x: auto; -webkit-overflow-scrolling: touch; flex-wrap: nowrap; width: 100%; }
    .tab-btn { white-space: nowrap; padding: 6px 12px; font-size: 12px; }

    /* Search bar */
    .search-bar { flex-wrap: wrap; }
    .search-input-wrap { max-width: 100%; }

    /* Action rows */
    .flex-between { flex-wrap: wrap; gap: 10px; }

    /* Invoice line items table */
    .line-items-table th, .line-items-table td { padding: 6px 8px; font-size: 11px; }
  }

  /* Bottom navigation (mobile only) */
  .bottom-nav {
    display: none;
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--navy-dark);
    border-top: 1px solid rgba(255,255,255,0.08);
    z-index: 200;
    padding: 6px 0 env(safe-area-inset-bottom, 6px);
    box-shadow: 0 -4px 20px rgba(13,26,58,0.3);
  }
  .bottom-nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 4px 2px;
    cursor: pointer;
    color: rgba(255,255,255,0.45);

// ─── GITHUB STORAGE ───
function useGitHubStorage() {
  const [config, setConfig] = useState(() => {
    const s = localStorage.getItem('gs_github_config');
    return s ? JSON.parse(s) : { token: '', repo: '', owner: '', branch: 'main', configured: false };
  });
  const [syncing, setSyncing] = useState(false);
  const [lastSync, setLastSync] = useState(null);

  const saveConfig = (cfg) => {
    localStorage.setItem('gs_github_config', JSON.stringify({ ...cfg, configured: true }));
    setConfig({ ...cfg, configured: true });
  };

  const apiUrl = (path) => `https://api.github.com/repos/${config.owner}/${config.repo}/contents/${path}`;

  const readFile = async (path) => {
    try {
      const r = await fetch(apiUrl(path), { headers: { Authorization: `token ${config.token}`, Accept: 'application/vnd.github.v3+json' } });
      if (!r.ok) return null;
      const d = await r.json();
      return { content: JSON.parse(atob(d.content.replace(/\n/g,''))), sha: d.sha };
    } catch { return null; }
  };

  const writeFile = async (path, data, sha) => {
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));
    const body = { message: `Update ${path} — Go Systematic Accounts`, content, branch: config.branch };
    if (sha) body.sha = sha;
    const r = await fetch(apiUrl(path), {
      method: 'PUT', headers: { Authorization: `token ${config.token}`, 'Content-Type': 'application/json', Accept: 'application/vnd.github.v3+json' },
      body: JSON.stringify(body)
    });
    return r.ok;
  };

  const loadData = async () => {
    if (!config.configured) return null;
    setSyncing(true);
    const result = await readFile('accounts-data.json');
    setSyncing(false);
    if (result) { setLastSync(new Date()); return result; }
    return null;
  };

  const saveData = async (data, sha) => {
    if (!config.configured) return false;
    setSyncing(true);
    const ok = await writeFile('accounts-data.json', data, sha);
    setSyncing(false);
    if (ok) setLastSync(new Date());
    return ok;
  };

  return { config, saveConfig, loadData, saveData, syncing, lastSync };
}

const fmt = (n) => '₹' + Number(n||0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtDate = (d) => d ? new Date(d).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }) : '—';
const genId = (prefix) => `${prefix}-${Date.now().toString(36).toUpperCase()}`;
const today = () => new Date().toISOString().split('T')[0];

const calcLineItem = (item) => {
  const subtotal = (parseFloat(item.qty)||0) * (parseFloat(item.rate)||0);
  const gstAmt = subtotal * ((parseFloat(item.gst)||0)/100);
  return { ...item, subtotal, gstAmt, total: subtotal + gstAmt };
};

const calcDoc = (items, discount=0) => {
  const lines = items.map(calcLineItem);
  const subtotal = lines.reduce((a,b) => a + b.subtotal, 0);
  const gstTotal = lines.reduce((a,b) => a + b.gstAmt, 0);
  const discAmt = subtotal * ((parseFloat(discount)||0)/100);
  const grand = subtotal + gstTotal - discAmt;
  return { lines, subtotal, gstTotal, discAmt, grand };
};

// Financial year helper
function getFY(dateStr) {
  if(!dateStr) return 'FY26-27';
  var d = new Date(dateStr);
  var y = d.getFullYear(), m = d.getMonth();
  var startY = m >= 3 ? y : y-1;
  return 'FY'+(String(startY).slice(2))+'-'+(String(startY+1).slice(2));
}
function currentFY() { return getFY(new Date().toISOString()); }

// ─── ACCOUNTING RULES (single source of truth) ───
// A document counts as REVENUE only if it represents a real, final sale that
// hasn't been superseded by a later document.
// - Quotation: never revenue (just an estimate)
// - Proforma Invoice: never revenue (payment request; not a tax document)
// - Cancelled anything: never revenue
// - A document that was converted into another (convertedTo set): superseded, skip it
// - Tax Invoice / Invoice cum Receipt / Debit Note: revenue (if not superseded/cancelled)
// - Credit Note: negative revenue (reduces income)
function isRevenueDoc(d) {
  if (!d) return false;
  if (d.status === 'Cancelled') return false;
  if (d.convertedTo) return false;               // superseded by a later doc
  if (d.type === 'Quotation') return false;
  if (d.type === 'Proforma Invoice') return false;
  if (d.type === 'Credit Note') return false;    // handled separately as negative
  return true; // Tax Invoice, Invoice cum Receipt, Debit Note
}
function revenueOf(list) {
  return (list||[]).reduce((sum,d)=>{
    if (d.status === 'Cancelled') return sum;
    if (d.convertedTo) return sum;
    if (d.type === 'Credit Note') return sum - (d.grand||0);
    if (isRevenueDoc(d)) return sum + (d.grand||0);
    return sum;
  }, 0);
}
// GST collected: only from real revenue docs
function gstCollectedOf(list) {
  return (list||[]).reduce((sum,d)=>{
    if (!isRevenueDoc(d)) return sum;
    return sum + (d.gstTotal||0);
  }, 0);
}

// ─── DASHBOARD ───
function Dashboard({ data, setPage, fyFilter, setFyFilter }) {
  const allInvoices = data.invoices || [];
  const allExpenses = data.expenses || [];
  const allReceipts = data.receipts || [];
  const invoices = fyFilter==='All' ? allInvoices : allInvoices.filter(i=>getFY(i.date)===fyFilter);
  const expenses = fyFilter==='All' ? allExpenses : allExpenses.filter(e=>getFY(e.date)===fyFilter);
  const receipts = fyFilter==='All' ? allReceipts : allReceipts.filter(r=>getFY(r.date)===fyFilter);

  const totalBilled = revenueOf(invoices);
  const totalReceived = receipts.reduce((a,b)=>a+(b.amount||0),0);
  const totalExpenses = expenses.reduce((a,b)=>a+(b.amount||0),0);
  const outstanding = totalBilled - totalReceived;

  const recent = [...invoices].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,5);

  const paid = invoices.filter(i=>i.status==='Paid').length;
  const today2 = new Date();
  const overdueInvs = invoices.filter(i=>{
    if(i.status==='Paid'||i.status==='Cancelled'||i.status==='Draft') return false;
    if(!i.dueDate) return false;
    return new Date(i.dueDate) < today2;
  });
  const daysOverdue = (inv) => Math.floor((today2-new Date(inv.dueDate))/(1000*60*60*24));
  const pending = invoices.filter(i=>i.status==='Pending').length;
  const overdue = invoices.filter(i=>i.status==='Overdue').length;

  return (
    <div>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16,flexWrap:'wrap',gap:10}}>
        <div>
          <div className="section-title">Dashboard</div>
          <div className="section-sub">Financial overview for <strong>{fyFilter==='All'?'All Years':fyFilter}</strong></div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <span style={{fontSize:12,color:'var(--text-muted)',fontWeight:500}}>Financial Year:</span>
          <div className="tabs" style={{marginBottom:0}}>
            {ALL_FYS.map(fy=>(
              <button key={fy} className={`tab-btn ${fyFilter===fy?'active':''}`} onClick={()=>setFyFilter(fy)}>{fy}</button>
            ))}
          </div>
        </div>
      </div>
      <div className="stats-grid">
        <div className="stat-card navy">
          <div className="stat-icon">🧾</div>
          <div className="stat-label">Total Billed</div>
          <div className="stat-value">{fmt(totalBilled)}</div>
          <div className="stat-sub">{invoices.length} documents</div>
        </div>
        <div className="stat-card blue">
          <div className="stat-icon">💳</div>
          <div className="stat-label">Amount Received</div>
          <div className="stat-value">{fmt(totalReceived)}</div>
          <div className="stat-sub">{receipts.length} receipts</div>
        </div>
        <div className="stat-card amber">
          <div className="stat-icon">⏳</div>
          <div className="stat-label">Outstanding</div>
          <div className="stat-value">{fmt(outstanding)}</div>
          <div className="stat-sub">{pending} pending · {overdue} overdue</div>
        </div>
        <div className="stat-card brown">
          <div className="stat-icon">💸</div>
          <div className="stat-label">Total Expenses</div>
          <div className="stat-value">{fmt(totalExpenses)}</div>
          <div className="stat-sub">{expenses.length} entries</div>
        </div>
      </div>

      {overdueInvs.length>0 && (
        <div style={{background:'var(--danger-bg)',border:'1px solid #F5AABB',borderRadius:10,padding:'14px 18px',marginBottom:18,display:'flex',alignItems:'flex-start',gap:12}}>
          <div style={{fontSize:24,flexShrink:0}}>⚠️</div>
          <div style={{flex:1}}>
            <div style={{fontWeight:700,color:'var(--danger)',fontSize:14,marginBottom:6}}>
              {overdueInvs.length} Overdue Invoice{overdueInvs.length>1?'s':''} Require Attention
            </div>
            <div style={{display:'flex',flexWrap:'wrap',gap:8}}>
              {overdueInvs.map(inv=>(
                <div key={inv.id} style={{background:'white',border:'1px solid #F5AABB',borderRadius:6,padding:'4px 10px',fontSize:12}}>
                  <strong>{inv.number}</strong> — {inv.clientName||'Unknown'}
                  <span style={{color:'var(--danger)',fontWeight:600,marginLeft:6}}>{daysOverdue(inv)}d overdue</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}
      <div className="grid-2" style={{marginBottom:24}}>
        <div className="card">
          <div className="card-header">
            <span className="card-title">Recent Documents</span>
            <button className="btn btn-ghost btn-sm" onClick={()=>setPage('invoices')}>View all →</button>
          </div>
          <div className="table-wrap">
            {recent.length === 0
              ? <div className="empty-state"><div className="icon">📄</div><p>No documents yet</p></div>
              : <table>
                  <thead><tr><th>No.</th><th>Client</th><th>Type</th><th>Amount</th><th>Status</th></tr></thead>
                  <tbody>
                    {recent.map(inv => (
                      <tr key={inv.id}>
                        <td className="font-mono" style={{fontSize:12}}>{inv.number}</td>
                        <td>{inv.clientName||'—'}</td>
                        <td><span className="badge badge-navy" style={{fontSize:10}}>{inv.type}</span></td>
                        <td className="amount">{fmt(inv.grand)}</td>
                        <td><StatusBadge s={inv.status}/></td>
                      </tr>
                    ))}
                  </tbody>
                </table>
            }
          </div>
        </div>

        <div className="card">
          <div className="card-header">
            <span className="card-title">Invoice Status</span>
          </div>
          <div className="card-body">
            <StatusBar label="Paid" count={paid} total={invoices.length} color="var(--success)" />
            <StatusBar label="Pending" count={pending} total={invoices.length} color="var(--amber)" />
            <StatusBar label="Overdue" count={overdue} total={invoices.length} color="var(--danger)" />
            <StatusBar label="Draft" count={invoices.filter(i=>i.status==='Draft').length} total={invoices.length} color="var(--text-muted)" />
            <div className="divider"/>
            <div style={{fontSize:13,color:'var(--text-secondary)'}}>
              <strong>FY Summary</strong>
              <div style={{marginTop:10,display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:8}}>
                <SummaryItem label="Net Revenue" val={fmt(totalReceived)}/>
                <SummaryItem label="Total GST" val={fmt(invoices.reduce((a,b)=>a+(b.gstTotal||0),0))}/>
                <SummaryItem label="Expenses" val={fmt(totalExpenses)}/>
                <SummaryItem label="Net P&L" val={fmt(totalReceived-totalExpenses)}/>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function StatusBar({ label, count, total, color }) {
  const pct = total > 0 ? (count/total*100) : 0;
  return (
    <div style={{marginBottom:14}}>
      <div className="flex-between" style={{marginBottom:4}}>
        <span style={{fontSize:13}}>{label}</span>
        <span style={{fontSize:13,fontWeight:600}}>{count} / {total}</span>
      </div>
      <div style={{height:6,background:'var(--border)',borderRadius:3}}>
        <div style={{height:6,width:pct+'%',background:color,borderRadius:3,transition:'width 0.4s'}}/>
      </div>
    </div>
  );
}
function SummaryItem({label,val}) {
  return <div style={{background:'var(--off-white)',padding:'8px 10px',borderRadius:6}}>
    <div style={{fontSize:10,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'0.5px'}}>{label}</div>
    <div style={{fontSize:14,fontWeight:700,color:'var(--navy)',fontFamily:'Rajdhani, sans-serif'}}>{val}</div>
  </div>;
}
function StatusBadge({s}) {
  const map = { Paid:'badge-success', Pending:'badge-warning', Overdue:'badge-danger', Draft:'badge-navy', Sent:'badge-blue', Cancelled:'badge-amber' };
  return <span className={`badge ${map[s]||'badge-navy'}`}>{s||'Draft'}</span>;
}

// ─── INVOICES ───
function Invoices({ data, persist, company, fyFilter }) {
  const [showForm, setShowForm] = useState(false);
  const [editing, setEditing] = useState(null);
  const [preview, setPreview] = useState(null);
  const [filter, setFilter] = useState('All');
  const [search, setSearch] = useState('');
  const invoices = data.invoices || [];

  const fyInvoices = (fyFilter && fyFilter!=='All') ? invoices.filter(i=>getFY(i.date)===fyFilter) : invoices;
  const filtered = fyInvoices.filter(inv => {
    const matchFilter = filter==='All' || inv.type===filter || inv.status===filter;
    const matchSearch = !search || (inv.number||'').toLowerCase().includes(search.toLowerCase()) || (inv.clientName||'').toLowerCase().includes(search.toLowerCase());
    return matchFilter && matchSearch;
  }).sort((a,b)=>new Date(b.date)-new Date(a.date));

  const [showICR, setShowICR] = useState(null);
  const save = (doc) => {
    const inv = { ...doc, id: doc.id||genId('INV'), date: doc.date||today() };
    const updated = doc.id ? invoices.map(i=>i.id===doc.id?inv:i) : [inv, ...invoices];
    persist({ ...data, invoices: updated });
    setShowForm(false); setEditing(null);
  };
  const del = (id) => { if(confirm('Delete this document?')) persist({ ...data, invoices: invoices.filter(i=>i.id!==id) }); };
  const setStatus = (id, status) => persist({ ...data, invoices: invoices.map(i=>i.id===id?{...i,status}:i) });

  const saveICR = (icr) => {
    // Save as a new Invoice cum Receipt doc, mark original as Paid
    const newDoc = { ...icr, id: genId('ICR'), type: 'Invoice cum Receipt', status: 'Paid', convertedFrom: icr.sourceId };
    const updatedInvoices = [
      newDoc,
      ...invoices.map(i => i.id===icr.sourceId ? {...i, status:'Paid', convertedTo: newDoc.id} : i)
    ];
    // Also create a receipt record automatically
    const rec = {
      id: genId('REC'), number: icr.receiptNumber, date: icr.paymentDate||today(),
      clientName: icr.clientName, invoiceRef: icr.sourceNumber, amount: icr.grand,
      mode: icr.paymentMode, transRef: icr.transRef, notes: 'Auto-generated from Invoice cum Receipt ' + newDoc.id
    };
    persist({ ...data, invoices: updatedInvoices, receipts: [...(data.receipts||[]), rec] });
    setShowICR(null);
    // Auto-download PDF
    setTimeout(() => exportICRPDF(newDoc, icr, company), 400);
  };

  const cancelDoc = (doc) => {
    if(!confirm('Cancel '+doc.number+'? It will no longer be counted as income. You can re-activate it later by changing status.')) return;
    persist({ ...data, invoices: invoices.map(i=>i.id===doc.id?{...i, status:'Cancelled'}:i) });
  };

  const convertToProforma = (quotation) => {
    const newNum = quotation.number.replace('QUO','PI').replace('Q-','PI-') + '-PI';
    const pi = {
      ...quotation,
      id: genId('INV'),
      type: 'Proforma Invoice',
      number: newNum,
      date: today(),
      dueDate: '',
      status: 'Draft',
      convertedFrom: quotation.id,
      notes: quotation.notes || '',
    };
    const updated = [pi, ...invoices.map(i=>i.id===quotation.id?{...i,status:'Sent',convertedTo:pi.id}:i)];
    persist({...data, invoices: updated});
  };

  const reCreateReceipt = (icrDoc) => {
    // Re-generate a receipt record from an existing ICR document
    const existing = (data.receipts||[]).find(r=>r.invoiceRef===icrDoc.sourceNumber||r.invoiceRef===icrDoc.number);
    if(existing) {
      if(!confirm('A receipt for this ICR already exists. Download the existing one?')) return;
      exportReceiptPDF(existing, company);
      return;
    }
    // Create a new receipt record
    const rec = {
      id: genId('REC'),
      number: 'REC-' + Date.now().toString(36).toUpperCase(),
      date: icrDoc.paymentDate || icrDoc.date || today(),
      clientName: icrDoc.clientName,
      invoiceRef: icrDoc.sourceNumber || icrDoc.number,
      amount: icrDoc.grand,
      mode: icrDoc.paymentMode || 'Bank Transfer',
      transRef: icrDoc.transRef || '',
      notes: 'Re-generated from ICR ' + icrDoc.number
    };
    const updated = { ...data, receipts: [...(data.receipts||[]), rec] };
    persist(updated);
    setTimeout(() => exportReceiptPDF(rec, company), 400);
  };

  return (
    <div>
      <div className="flex-between" style={{marginBottom:12}}>
        <div>
          <div className="section-title">Invoices & Documents</div>
          <div className="section-sub">Manage all your financial documents{fyFilter&&fyFilter!=='All'?' — '+fyFilter:''}</div>
        </div>
        <button className="btn btn-primary" onClick={()=>{setEditing(null);setShowForm(true);}}>+ New Document</button>
      </div>
      <div className="tabs" style={{marginBottom:8}}>
        {ALL_FYS.map(fy=>(
          <button key={fy} className={`tab-btn ${(fyFilter||'All')===fy?'active':''}`} onClick={()=>{}}>
            {fy}
          </button>
        ))}
      </div>

      <div className="search-bar">
        <div className="search-input-wrap">
          <span className="icon">🔍</span>
          <input className="search-input" placeholder="Search by number or client…" value={search} onChange={e=>setSearch(e.target.value)}/>
        </div>
        <div className="tabs">
          {['All','Tax Invoice','Proforma Invoice','Invoice cum Receipt','Debit Note','Credit Note','Pending','Overdue'].map(f=>(
            <button key={f} className={`tab-btn ${filter===f?'active':''}`} onClick={()=>setFilter(f)}>{f}</button>
          ))}
        </div>
      </div>

      <div className="card">
        <div className="table-wrap">
          {filtered.length===0
            ? <div className="empty-state"><div className="icon">🧾</div><h3>No documents found</h3><p>Create your first invoice or document</p><button className="btn btn-primary" onClick={()=>setShowForm(true)}>+ New Document</button></div>
            : <table>
                <thead><tr><th>Number</th><th>Type</th><th>Date</th><th>Due Date</th><th>Client</th><th>Subtotal</th><th>GST</th><th>Grand Total</th><th>Status</th><th>Actions</th></tr></thead>
                <tbody>
                  {filtered.map(inv=>(
                    <tr key={inv.id}>
                      <td className="font-mono" style={{fontSize:12}}>{inv.number}</td>
                      <td><span className="badge badge-navy" style={{fontSize:10}}>{inv.type}</span></td>
                      <td>{fmtDate(inv.date)}</td>
                      <td>{fmtDate(inv.dueDate)}</td>
                      <td>{inv.clientName||'—'}</td>
                      <td className="amount">{fmt(inv.subtotal)}</td>
                      <td className="amount" style={{color:'var(--amber)'}}>{fmt(inv.gstTotal)}</td>
                      <td className="amount" style={{color:'var(--navy)'}}>{fmt(inv.grand)}</td>
                      <td>
                        <select value={inv.status||'Draft'} onChange={e=>setStatus(inv.id,e.target.value)} style={{border:'none',background:'transparent',fontSize:12,cursor:'pointer',fontFamily:'Inter',fontWeight:600}}>
                          {['Draft','Sent','Pending','Paid','Overdue','Cancelled'].map(s=><option key={s}>{s}</option>)}
                        </select>
                      </td>
                      <td>
                        <div className="flex-gap">
                          <button className="btn btn-ghost btn-sm" onClick={()=>setPreview(inv)} title="Preview">👁</button>
                          <button className="btn btn-ghost btn-sm" onClick={()=>{setEditing(inv);setShowForm(true);}} title="Edit">✏️</button>
                          <button className="btn btn-ghost btn-sm" onClick={()=>exportInvoicePDF(inv, company)} title="PDF">📄</button>
                          {(() => {
                            if(inv.type==='Invoice cum Receipt') {
                              // On ICR row: show re-download ICR PDF + re-create receipt
                              return <span style={{display:'flex',gap:4}}>
                                <button className="btn btn-ghost btn-sm" onClick={()=>exportICRPDF(inv,inv,company)} title="Download ICR PDF" style={{color:'var(--success)',fontSize:13}}>📋</button>
                                <button className="btn btn-ghost btn-sm" onClick={()=>reCreateReceipt(inv)} title="Re-generate Payment Receipt" style={{color:'var(--blue)',fontSize:13}}>🧾</button>
                              </span>;
                            }
                            if(inv.type==='Quotation') {
                              const linkedPI = invoices.find(x=>x.convertedFrom===inv.id && x.type==='Proforma Invoice');
                              const linkedICR2 = invoices.find(x=>x.convertedFrom===inv.id && x.type==='Invoice cum Receipt');
                              if(linkedICR2) return <span style={{fontSize:11,color:'var(--success)',fontWeight:600,padding:'0 4px'}}>✓ ICR</span>;
                              if(linkedPI) return <span style={{fontSize:11,color:'var(--blue)',fontWeight:600,padding:'0 4px'}}>✓ PI</span>;
                              return <button className="btn btn-ghost btn-sm" title="Convert to Proforma Invoice" onClick={()=>convertToProforma(inv)} style={{color:'var(--blue)',fontSize:13}}>📋</button>;
                            }
                            if(inv.type==='Proforma Invoice'||inv.type==='Tax Invoice') {
                              const linkedICR = invoices.find(x=>x.convertedFrom===inv.id);
                              if(linkedICR) {
                                return <span title={'ICR: '+linkedICR.number} style={{fontSize:11,color:'var(--success)',padding:'0 4px',fontWeight:600}}>✓ ICR</span>;
                              }
                              if(inv.status==='Cancelled') {
                                return <span title="Cancelled — not counted as income" style={{fontSize:11,color:'var(--danger)',fontWeight:600,padding:'0 4px'}}>✕ Cancelled</span>;
                              }
                              return <span style={{display:'flex',gap:2}}>
                                <button className="btn btn-ghost btn-sm" onClick={()=>setShowICR(inv)} title="Payment received — convert to Invoice cum Receipt" style={{color:'var(--success)',fontSize:15}}>🔄</button>
                                <button className="btn btn-ghost btn-sm" onClick={()=>cancelDoc(inv)} title="Cancel (no payment received)" style={{color:'var(--danger)',fontSize:13}}>✕</button>
                              </span>;
                            }
                            return null;
                          })()}
                          <button className="btn btn-ghost btn-sm" onClick={()=>del(inv.id)} title="Delete">🗑</button>
                        </div>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
          }
        </div>
      </div>

      <div style={{marginTop:14,display:'flex',gap:10}}>
        <button className="btn btn-outline btn-sm" onClick={()=>exportToExcel(invoices,'Invoices')}>⬇ Export Excel</button>
        <button className="btn btn-outline btn-sm" onClick={()=>exportAllPDF(invoices, company)}>⬇ Export PDF Summary</button>
      </div>

      {showForm && <InvoiceForm initial={editing} clients={data.clients||[]} onSave={save} onClose={()=>{setShowForm(false);setEditing(null);}} company={company} />}
      {preview && <InvoicePreviewModal inv={preview} onClose={()=>setPreview(null)} company={company} />}
      {showICR && <ICRModal inv={showICR} onSave={saveICR} onClose={()=>setShowICR(null)} company={company} />}
    </div>
  );
}

// ─── INVOICE FORM ───
function InvoiceForm({ initial, clients, onSave, onClose, company }) {
  const [doc, setDoc] = useState(initial || {
    type: 'Tax Invoice', number: '', date: today(), dueDate: '', status: 'Draft',
    clientName: '', clientAddress: '', clientGST: '', clientEmail: '',
    items: [{ desc: '', hsn: '', qty: 1, unit: 'Nos', rate: 0, gst: 18 }],
    discount: 0, notes: '', terms: 'Payment due within 30 days.\nPlease include invoice number in payment reference.',
    placeOfSupply: '', reverseCharge: false,
  });

  const { lines, subtotal, gstTotal, discAmt, grand } = calcDoc(doc.items||[], doc.discount);

  const setField = (k,v) => setDoc(d=>({...d,[k]:v}));
  const setItem = (i,k,v) => setDoc(d=>({ ...d, items: d.items.map((it,idx)=>idx===i?{...it,[k]:v}:it) }));
  const addItem = () => setDoc(d=>({...d,items:[...d.items,{desc:'',hsn:'',qty:1,unit:'Nos',rate:0,gst:18}]}));
  const delItem = (i) => setDoc(d=>({...d,items:d.items.filter((_,idx)=>idx!==i)}));

  const fillClient = (name) => {
    const c = clients.find(c=>c.name===name);
    if(c) setDoc(d=>({...d,clientName:c.name,clientAddress:c.address||'',clientGST:c.gst||'',clientEmail:c.email||''}));
    else setField('clientName',name);
  };

  const handleSave = () => {
    if (!doc.number) { alert('Please enter a document number'); return; }
    onSave({ ...doc, subtotal, gstTotal, discAmt, grand, lines });
  };

  return (
    <div className="modal-backdrop">
      <div className="modal modal-xl">
        <div className="modal-header">
          <h2>{initial ? 'Edit' : 'New'} {doc.type}</h2>
          <button className="modal-close" onClick={onClose}>✕</button>
        </div>
        <div className="modal-body" style={{maxHeight:'75vh',overflowY:'auto'}}>
          {/* Doc type & number */}
          <div className="form-grid-3" style={{marginBottom:16}}>
            <div className="form-group">
              <label className="form-label">Document Type</label>
              <select className="form-control" value={doc.type} onChange={e=>setField('type',e.target.value)}>
                {DOC_TYPES.map(t=><option key={t}>{t}</option>)}
              </select>
            </div>
            <div className="form-group">
              <label className="form-label">Document Number *</label>
              <input className="form-control" value={doc.number} onChange={e=>setField('number',e.target.value)} placeholder="GS-2024-001"/>
            </div>
            <div className="form-group">
              <label className="form-label">Status</label>
              <select className="form-control" value={doc.status} onChange={e=>setField('status',e.target.value)}>
                {['Draft','Sent','Pending','Paid','Overdue','Cancelled'].map(s=><option key={s}>{s}</option>)}
              </select>
            </div>
          </div>
          <div className="form-grid-3" style={{marginBottom:16}}>
            <div className="form-group">
              <label className="form-label">Issue Date</label>
              <input type="date" className="form-control" value={doc.date} onChange={e=>setField('date',e.target.value)}/>
            </div>
            <div className="form-group">
              <label className="form-label">Due Date</label>
              <input type="date" className="form-control" value={doc.dueDate} onChange={e=>setField('dueDate',e.target.value)}/>
            </div>
            <div className="form-group">
              <label className="form-label">Place of Supply</label>
              <input className="form-control" value={doc.placeOfSupply} onChange={e=>setField('placeOfSupply',e.target.value)} placeholder="State"/>
            </div>
          </div>

          <div className="divider"/>
          <div style={{marginBottom:12,fontWeight:600,fontSize:13,color:'var(--navy)'}}>🏢 Client / Bill To</div>
          <div className="form-grid-2" style={{marginBottom:8}}>
            <div className="form-group">
              <label className="form-label">Client Name *</label>
              <input className="form-control" value={doc.clientName} list="client-list" onChange={e=>fillClient(e.target.value)} placeholder="Search or type client name"/>
              <datalist id="client-list">{clients.map(c=><option key={c.id} value={c.name}/>)}</datalist>
            </div>
            <div className="form-group">
              <label className="form-label">Client Email</label>
              <input className="form-control" value={doc.clientEmail} onChange={e=>setField('clientEmail',e.target.value)} placeholder="client@email.com"/>
            </div>
          </div>
          <div className="form-grid-2">
            <div className="form-group">
              <label className="form-label">Client Address</label>
              <textarea className="form-control" rows={2} value={doc.clientAddress} onChange={e=>setField('clientAddress',e.target.value)} placeholder="Full address"/>
            </div>
            <div className="form-group">
              <label className="form-label">Client GST Number</label>
              <input className="form-control" value={doc.clientGST} onChange={e=>setField('clientGST',e.target.value)} placeholder="GSTIN (if applicable)"/>
            </div>
          </div>

          <div className="divider"/>
          <div className="flex-between" style={{marginBottom:12}}>
            <span style={{fontWeight:600,fontSize:13,color:'var(--navy)'}}>📦 Line Items</span>
            <button className="btn btn-outline btn-sm" onClick={addItem}>+ Add Item</button>
          </div>
          <div className="table-wrap">
            <table className="line-items-table">
              <thead>
                <tr>
                  <th style={{width:'28%',padding:'9px 10px'}}>Description</th>
                  <th style={{width:'9%',padding:'9px 10px'}}>HSN/SAC</th>
                  <th style={{width:'7%',padding:'9px 10px'}}>Qty</th>
                  <th style={{width:'7%',padding:'9px 10px'}}>Unit</th>
                  <th style={{width:'11%',padding:'9px 10px'}}>Rate (₹)</th>
                  <th style={{width:'8%',padding:'9px 10px'}}>GST %</th>
                  <th style={{width:'10%',padding:'9px 10px'}}>Subtotal</th>
                  <th style={{width:'10%',padding:'9px 10px'}}>GST</th>
                  <th style={{width:'10%',padding:'9px 10px'}}>Total</th>
                  <th style={{width:'4%'}}></th>
                </tr>
              </thead>
              <tbody>
                {(doc.items||[]).map((item,i)=>{
                  const c = calcLineItem(item);
                  return (
                    <tr key={i}>
                      <td><input value={item.desc} onChange={e=>setItem(i,'desc',e.target.value)} placeholder="Item / service description"/></td>
                      <td><input value={item.hsn} onChange={e=>setItem(i,'hsn',e.target.value)} placeholder="HSN"/></td>
                      <td><input type="number" value={item.qty} onChange={e=>setItem(i,'qty',e.target.value)} min={0}/></td>
                      <td>
                        <select value={item.unit} onChange={e=>setItem(i,'unit',e.target.value)} style={{border:'none',background:'transparent',fontSize:12,width:'100%',fontFamily:'Inter'}}>
                          {['Nos','Hrs','Days','Kg','Ltr','Mtr','Pcs','Set','Job'].map(u=><option key={u}>{u}</option>)}
                        </select>
                      </td>
                      <td><input type="number" value={item.rate} onChange={e=>setItem(i,'rate',e.target.value)} min={0}/></td>
                      <td>
                        <select value={item.gst} onChange={e=>setItem(i,'gst',e.target.value)} style={{border:'none',background:'transparent',fontSize:12,fontFamily:'Inter'}}>
                          {GST_RATES.map(r=><option key={r} value={r}>{r}%</option>)}
                        </select>
                      </td>
                      <td style={{color:'var(--text-secondary)',fontSize:12}}>{fmt(c.subtotal)}</td>
                      <td style={{color:'var(--amber)',fontSize:12}}>{fmt(c.gstAmt)}</td>
                      <td style={{fontWeight:600,color:'var(--navy)',fontSize:12}}>{fmt(c.total)}</td>
                      <td><button className="btn btn-ghost btn-sm" onClick={()=>delItem(i)} style={{color:'var(--danger)',padding:'2px 6px'}}>✕</button></td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>

          <div style={{display:'flex',flexWrap:'wrap',gap:16,marginTop:16,alignItems:'flex-start'}}>
            <div style={{flex:2,minWidth:260}}>
              <div className="form-group">
                <label className="form-label">Discount (%)</label>
                <input type="number" className="form-control" value={doc.discount} onChange={e=>setField('discount',e.target.value)} min={0} max={100} style={{maxWidth:120}}/>
              </div>
              <div className="form-group">
                <label className="form-label">Notes / Remarks</label>
                <textarea className="form-control" rows={2} value={doc.notes} onChange={e=>setField('notes',e.target.value)} placeholder="Additional notes for this document"/>
              </div>
              <div className="form-group">
                <label className="form-label">Terms & Conditions</label>
                <textarea className="form-control" rows={3} value={doc.terms} onChange={e=>setField('terms',e.target.value)}/>
              </div>
            </div>
            <div style={{minWidth:240,flex:1,background:'var(--off-white)',borderRadius:8,padding:16,border:'1px solid var(--border)'}}>
              <TotalRow label="Subtotal" val={fmt(subtotal)}/>
              {discAmt>0 && <TotalRow label={`Discount (${doc.discount}%)`} val={`- ${fmt(discAmt)}`} color="var(--success)"/>}
              <TotalRow label="Total GST" val={fmt(gstTotal)} color="var(--amber)"/>
              <div style={{borderTop:'2px solid var(--navy)',paddingTop:10,marginTop:8}}>
                <TotalRow label="Grand Total" val={fmt(grand)} bold large/>
              </div>
              <div style={{marginTop:8,fontSize:11,color:'var(--text-muted)'}}>
                GST: {company ? company.gst : DEFAULT_COMPANY.gst}
              </div>
            </div>
          </div>
        </div>
        <div className="modal-footer">
          <button className="btn btn-outline" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" onClick={handleSave}>💾 Save Document</button>
        </div>
      </div>
    </div>
  );
}

function TotalRow({label,val,color,bold,large}) {
  return (
    <div className="flex-between" style={{padding:'4px 0',fontSize:large?15:13,fontWeight:bold?700:400,fontFamily:bold?'Rajdhani, sans-serif':'Inter, sans-serif',color:color||'var(--text-primary)'}}>
      <span>{label}</span><span>{val}</span>
    </div>
  );
}

    <div className="modal-backdrop">
      <div className="modal modal-xl">
        <div className="modal-header">
          <h2>Document Preview — {inv.number}</h2>
          <button className="modal-close" onClick={onClose}>✕</button>
        </div>
        <div className="modal-body" style={{maxHeight:'80vh',overflowY:'auto',padding:0}}>
          <InvoiceDocument inv={inv} company={company}/>

        <div className="modal-footer">
          <button className="btn btn-outline" onClick={onClose}>Close</button>

function InvoiceDocument({ inv, company }) {
  const C = company || DEFAULT_COMPANY;
  const { lines, subtotal, gstTotal, discAmt, grand } = calcDoc(inv.items||[], inv.discount);
  return (
    <div className="invoice-preview" style={{background:'#fff'}}>
      <div className="inv-header-bar">
        <div>
          <div className="inv-company-name">{C.brand}</div>
          <div className="inv-tagline">{C.tagline}</div>
          <div style={{fontSize:11,color:'rgba(255,255,255,0.5)',marginTop:4}}>{C.name}</div>
          <div style={{fontSize:11,color:'rgba(255,255,255,0.5)'}}>{C.address}</div>
          {C.email && <div style={{fontSize:11,color:'rgba(255,255,255,0.5)'}}>{C.email}</div>}
          <div style={{fontSize:11,color:'rgba(255,255,255,0.4)',marginTop:4}}>GST: {C.gst} &nbsp;|&nbsp; PAN: {C.pan||'PENDING'}</div>
        </div>
        <div>
          <div className="inv-title">{inv.type}</div>
          <div className="inv-number">#{inv.number}</div>
          <div style={{fontSize:11,color:'rgba(255,255,255,0.5)',textAlign:'right',marginTop:6}}>
            Date: {fmtDate(inv.date)}<br/>
            {inv.dueDate && `Due: ${fmtDate(inv.dueDate)}`}
          </div>
        </div>
      </div>
      <div className="inv-body">
        <div className="inv-parties">
          <div>
            <div className="inv-party-label">Bill To</div>
            <div className="inv-party-name">{inv.clientName||'—'}</div>
            <div className="inv-party-detail">{inv.clientAddress||''}</div>
            {inv.clientGST && <div className="inv-party-detail">GST: {inv.clientGST}</div>}
            {inv.clientEmail && <div className="inv-party-detail">{inv.clientEmail}</div>}
          </div>
          <div>
            <div className="inv-party-label">Payment Details</div>
            {C.bank.name ? <>
              <div className="inv-party-detail">Bank: {C.bank.name}</div>
              <div className="inv-party-detail">A/C: {C.bank.account}</div>
              <div className="inv-party-detail">IFSC: {C.bank.ifsc}</div>
              <div className="inv-party-detail">Branch: {C.bank.branch}</div>
            </> : <div className="inv-party-detail" style={{color:'var(--amber)'}}>Bank details not configured.<br/>Add in Settings.</div>}
            {inv.placeOfSupply && <div className="inv-party-detail" style={{marginTop:6}}>Place of Supply: {inv.placeOfSupply}</div>}
          </div>
        </div>
        <table className="inv-table">
          <thead>
            <tr>
              <th>#</th><th>Description</th><th>HSN/SAC</th><th>Qty</th><th>Unit</th><th>Rate</th><th>GST%</th><th>GST Amt</th><th>Total</th>
            </tr>
          </thead>
          <tbody>
            {(lines.length>0?lines:inv.items||[]).map((item,i)=>{
              const c = calcLineItem(item);
              return (
                <tr key={i}>
                  <td>{i+1}</td>
                  <td>{item.desc}</td>
                  <td>{item.hsn||'—'}</td>
                  <td>{item.qty}</td>
                  <td>{item.unit||'Nos'}</td>
                  <td>{fmt(item.rate)}</td>
                  <td>{item.gst||0}%</td>
                  <td>{fmt(c.gstAmt)}</td>
                  <td style={{fontWeight:600}}>{fmt(c.total)}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
        <div className="inv-totals">
          <div className="inv-totals-box">
            <div className="inv-total-row"><span>Subtotal</span><span>{fmt(subtotal)}</span></div>
            {discAmt>0 && <div className="inv-total-row" style={{color:'var(--success)'}}><span>Discount</span><span>- {fmt(discAmt)}</span></div>}
            <div className="inv-total-row" style={{color:'var(--amber)'}}><span>Total GST</span><span>{fmt(gstTotal)}</span></div>
            <div className="inv-total-row grand"><span>Grand Total</span><span>{fmt(grand)}</span></div>
          </div>
        </div>
        {inv.notes && <div style={{marginTop:16,padding:'10px 14px',background:'var(--off-white)',borderRadius:6,fontSize:12,color:'var(--text-secondary)'}}>
          <strong>Notes:</strong> {inv.notes}
        </div>}
        {inv.terms && <div style={{marginTop:10,padding:'10px 14px',background:'var(--off-white)',borderRadius:6,fontSize:12,color:'var(--text-muted)'}}>
          <strong>Terms & Conditions:</strong><br/>{inv.terms}
        </div>}
      </div>
      <div className="inv-footer">
        <span>{C.name} — {C.brand}</span>
        <span>This is a computer-generated document</span>
        <span>{C.gst}</span>
      </div>
    </div>
  );
}

// ─── RECEIPTS ───
function Receipts({ data, persist, company, fyFilter }) {
  const [showForm, setShowForm] = useState(false);
  const [editing, setEditing] = useState(null);
  const allRec = data.receipts || [];
  const receipts = (fyFilter&&fyFilter!=='All') ? allRec.filter(r=>getFY(r.date)===fyFilter) : allRec;

  const save = (r) => {
    const rec = { ...r, id: r.id||genId('REC'), date: r.date||today() };
    const updated = r.id ? allRec.map(x=>x.id===r.id?rec:x) : [rec,...allRec];
    persist({ ...data, receipts: updated });
    setShowForm(false); setEditing(null);
  };
  const del = (id) => { if(confirm('Delete receipt?')) persist({ ...data, receipts: allRec.filter(r=>r.id!==id) }); };

  return (
    <div>
      <div className="flex-between" style={{marginBottom:12}}>
        <div>
          <div className="section-title">Payment Receipts</div>
          <div className="section-sub">Track all incoming payments{fyFilter&&fyFilter!=='All'?' — '+fyFilter:''}</div>
        </div>
        <button className="btn btn-primary" onClick={()=>{setEditing(null);setShowForm(true);}}>+ New Receipt</button>
      </div>
      <div className="tabs" style={{marginBottom:16}}>
        {ALL_FYS.map(fy=>(
          <button key={fy} className={`tab-btn ${(fyFilter||'All')===fy?'active':''}`} onClick={()=>{}}>
            {fy}
          </button>
        ))}
      </div>
      <div className="card">
        <div className="table-wrap">
          {receipts.length===0
            ? <div className="empty-state"><div className="icon">💳</div><h3>No receipts yet</h3><p>Record your first payment receipt</p><button className="btn btn-primary" onClick={()=>setShowForm(true)}>+ New Receipt</button></div>
            : <table>
                <thead><tr><th>Receipt No.</th><th>Date</th><th>Client</th><th>Against Invoice</th><th>Mode</th><th>Amount</th><th>TDS</th><th>Net</th><th>Actions</th></tr></thead>
                <tbody>
                  {receipts.sort((a,b)=>new Date(b.date)-new Date(a.date)).map(r=>(
                    <tr key={r.id}>
                      <td className="font-mono" style={{fontSize:12}}>{r.number}</td>
                      <td>{fmtDate(r.date)}</td>
                      <td>{r.clientName}</td>
                      <td>{r.invoiceRef||'—'}</td>
                      <td><span className="badge badge-blue">{r.mode||'Bank Transfer'}</span></td>
                      <td className="amount" style={{color:'var(--success)'}}>{fmt(r.amount)}</td>
                      <td className="amount" style={{color:'var(--danger)',fontSize:12}}>{r.tdsAmount?fmt(r.tdsAmount):'—'}</td>
                      <td className="amount" style={{fontSize:12}}>{r.tdsAmount?fmt(parseFloat(r.amount||0)-parseFloat(r.tdsAmount||0)):'—'}</td>
                      <td>
                        <div className="flex-gap">
                          <button className="btn btn-ghost btn-sm" onClick={()=>{setEditing(r);setShowForm(true);}}>✏️</button>
                          <button className="btn btn-ghost btn-sm" onClick={()=>exportReceiptPDF(r, company)}>📄</button>
                          <button className="btn btn-ghost btn-sm" onClick={()=>del(r.id)}>🗑</button>
                        </div>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
          }
        </div>
      </div>
      <div style={{marginTop:14}}>
        <button className="btn btn-outline btn-sm" onClick={()=>exportToExcel(receipts,'Receipts')}>⬇ Export Excel</button>
      </div>

      {showForm && <ReceiptForm initial={editing} invoices={data.invoices||[]} clients={data.clients||[]} onSave={save} onClose={()=>{setShowForm(false);setEditing(null);}} company={company} />}
    </div>
  );
}

function ReceiptForm({ initial, invoices, clients, onSave, onClose }) {
  const [r, setR] = useState(initial || { number: '', date: today(), clientName: '', invoiceRef: '', amount: '', mode: 'Bank Transfer', transRef: '', tdsAmount: '', tdsSection: '', grossAmount: '', notes: '' });
  const set = (k,v) => setR(x=>({...x,[k]:v}));
  return (
    <div className="modal-backdrop">
      <div className="modal" style={{maxWidth:560}}>
        <div className="modal-header"><h2>{initial?'Edit':'New'} Payment Receipt</h2><button className="modal-close" onClick={onClose}>✕</button></div>
        <div className="modal-body">
          <div className="form-grid-2">
            <div className="form-group"><label className="form-label">Receipt Number *</label><input className="form-control" value={r.number} onChange={e=>set('number',e.target.value)} placeholder="REC-2024-001"/></div>
            <div className="form-group"><label className="form-label">Date</label><input type="date" className="form-control" value={r.date} onChange={e=>set('date',e.target.value)}/></div>
          </div>
          <div className="form-group">
            <label className="form-label">Client / Payer</label>
            <input className="form-control" value={r.clientName} list="receipt-clients" onChange={e=>set('clientName',e.target.value)} placeholder="Client name"/>
            <datalist id="receipt-clients">{clients.map(c=><option key={c.id} value={c.name}/>)}</datalist>
          </div>
          <div className="form-grid-2">
            <div className="form-group">
              <label className="form-label">Against Invoice</label>
              <input className="form-control" value={r.invoiceRef} list="inv-refs" onChange={e=>set('invoiceRef',e.target.value)} placeholder="Invoice number"/>
              <datalist id="inv-refs">{invoices.map(i=><option key={i.id} value={i.number}/>)}</datalist>
            </div>
            <div className="form-group"><label className="form-label">Amount (₹)</label><input type="number" className="form-control" value={r.amount} onChange={e=>set('amount',e.target.value)} placeholder="0.00" min={0}/></div>
          </div>
          <div className="form-grid-2">
            <div className="form-group">
              <label className="form-label">Payment Mode</label>
              <select className="form-control" value={r.mode} onChange={e=>set('mode',e.target.value)}>
                {['Bank Transfer','NEFT','RTGS','IMPS','UPI','Cheque','Cash','Online'].map(m=><option key={m}>{m}</option>)}
              </select>
            </div>
            <div className="form-group"><label className="form-label">Transaction / Cheque Ref</label><input className="form-control" value={r.transRef} onChange={e=>set('transRef',e.target.value)} placeholder="UTR / Cheque no."/></div>
          </div>
          <div style={{background:'var(--surface-alt)',borderRadius:8,padding:12,marginBottom:12,border:'1px solid var(--border)'}}>
            <div style={{fontWeight:600,fontSize:12,color:'var(--navy)',marginBottom:10}}>🔖 TDS Deduction (if applicable)</div>
            <div className="form-grid-3">
              <div className="form-group">
                <label className="form-label">Gross Invoice Amount (₹)</label>
                <input type="number" className="form-control" value={r.grossAmount} onChange={e=>set('grossAmount',e.target.value)} placeholder="Invoice total"/>
              </div>
              <div className="form-group">
                <label className="form-label">TDS Deducted (₹)</label>
                <input type="number" className="form-control" value={r.tdsAmount} onChange={e=>set('tdsAmount',e.target.value)} placeholder="0.00"/>
              </div>
              <div className="form-group">
                <label className="form-label">TDS Section</label>
                <select className="form-control" value={r.tdsSection} onChange={e=>set('tdsSection',e.target.value)}>
                  <option value="">Not applicable</option>
                  {['194C - Contractor (1%)','194J - Professional (10%)','194H - Commission (5%)',
                    '194I - Rent (10%)','194A - Interest (10%)','194B - Lottery (30%)',
                    '194D - Insurance (5%)','194K - Dividend (10%)','Other'].map(s=><option key={s} value={s}>{s}</option>)}
                </select>
              </div>
            </div>
            {r.tdsAmount>0 && <div style={{marginTop:8,padding:'8px 12px',background:'var(--warning-bg)',borderRadius:6,fontSize:12,color:'var(--warning)'}}>
              Net received: ₹{fmt((parseFloat(r.grossAmount||r.amount||0)-parseFloat(r.tdsAmount||0)))} after TDS of ₹{fmt(r.tdsAmount)}
            </div>}
          </div>
          <div className="form-group"><label className="form-label">Notes</label><textarea className="form-control" rows={2} value={r.notes} onChange={e=>set('notes',e.target.value)}/></div>
        </div>
        <div className="modal-footer">
          <button className="btn btn-outline" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" onClick={()=>{if(!r.number||!r.amount){alert('Number & amount required');return;}onSave(r);}}>💾 Save Receipt</button>
        </div>
      </div>
    </div>
  );
}

// ─── EXPENSES ───
function Expenses({ data, persist, fyFilter }) {
  const [showForm, setShowForm] = useState(false);
  const [editing, setEditing] = useState(null);
  const [catFilter, setCatFilter] = useState('All');
  const allExpenses2 = data.expenses || [];
  const expenses = (fyFilter && fyFilter!=='All') ? allExpenses2.filter(e=>getFY(e.date)===fyFilter) : allExpenses2;
  const cats = ['All',...new Set(expenses.map(e=>e.category).filter(Boolean)),'Other'];

  const filtered = expenses.filter(e=>catFilter==='All'||e.category===catFilter).sort((a,b)=>new Date(b.date)-new Date(a.date));
  const total = filtered.reduce((a,b)=>a+(parseFloat(b.amount)||0),0);

  const save = (exp) => {
    const e = { ...exp, id: exp.id||genId('EXP'), date: exp.date||today() };
    const updated = exp.id ? allExpenses2.map(x=>x.id===exp.id?e:x) : [e,...allExpenses2];
    persist({ ...data, expenses: updated });
    setShowForm(false); setEditing(null);
  };
  const del = (id) => { if(confirm('Delete expense?')) persist({ ...data, expenses: allExpenses2.filter(e=>e.id!==id) }); };

  return (
    <div>
      <div className="flex-between" style={{marginBottom:20}}>
        <div>
          <div className="section-title">Expenses</div>
          <div className="section-sub">Track all business expenditures</div>
        </div>
        <button className="btn btn-primary" onClick={()=>{setEditing(null);setShowForm(true);}}>+ Add Expense</button>
      </div>

      <div style={{marginBottom:16}}>
        <div className="stat-card amber" style={{padding:'14px 18px',marginBottom:12}}>
          <div className="stat-label">Total ({catFilter})</div>
          <div className="stat-value" style={{fontSize:22}}>{fmt(total)}</div>
        </div>
        <div>
          <div className="tabs">
            {cats.map(c=><button key={c} className={`tab-btn ${catFilter===c?'active':''}`} onClick={()=>setCatFilter(c)}>{c}</button>)}
          </div>
        </div>
      </div>

      <div className="card">
        <div className="table-wrap">
          {filtered.length===0
            ? <div className="empty-state"><div className="icon">💸</div><h3>No expenses</h3><button className="btn btn-primary" onClick={()=>setShowForm(true)}>+ Add Expense</button></div>
            : <table>
                <thead><tr><th>Date</th><th>Category</th><th>Description</th><th>Vendor</th><th>GST Input</th><th>Amount</th><th>Receipt</th><th>📎</th><th>Actions</th></tr></thead>
                <tbody>
                  {filtered.map(e=>(
                    <tr key={e.id}>
                      <td>{fmtDate(e.date)}</td>
                      <td><span className="badge badge-amber">{e.category||'—'}</span></td>
                      <td>{e.desc}</td>
                      <td>{e.vendor||'—'}</td>
                      <td className="amount" style={{color:'var(--amber)'}}>{e.gstInput?fmt(e.gstInput):'-'}</td>
                      <td className="amount" style={{color:'var(--danger)'}}>{fmt(e.amount)}</td>
                      <td style={{fontSize:12,color:'var(--text-muted)'}}>{e.receiptNo||'—'}</td>
                      <td>{e.receiptImg
                        ? <img src={e.receiptImg} alt="Receipt" onClick={()=>window.open(e.receiptImg,'_blank')} style={{height:28,width:28,objectFit:'cover',borderRadius:4,cursor:'pointer',border:'1px solid var(--border)'}} title="View receipt"/>
                        : <span style={{color:'var(--text-muted)',fontSize:11}}>—</span>}
                      </td>
                      <td>
                        <div className="flex-gap">
                          <button className="btn btn-ghost btn-sm" onClick={()=>{setEditing(e);setShowForm(true);}}>✏️</button>
                          <button className="btn btn-ghost btn-sm" onClick={()=>del(e.id)}>🗑</button>
                        </div>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
          }
        </div>
      </div>
      <div style={{marginTop:14}}>
        <button className="btn btn-outline btn-sm" onClick={()=>exportToExcel(expenses,'Expenses')}>⬇ Export Excel</button>
      </div>

      {showForm && <ExpenseForm initial={editing} onSave={save} onClose={()=>{setShowForm(false);setEditing(null);}} />}
    </div>
  );
}
